<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Code Quest - Programmer's Picnic</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
body{
  margin:0;
  font-family:system-ui;
  background:#fff8eb;
}
.topbar{
  background:#d97706;
  color:white;
  padding:10px;
  font-weight:bold;
}
.container{
  display:flex;
  height:calc(100vh - 50px);
}
.left{
  width:35%;
  padding:15px;
  border-right:1px solid #eee;
  overflow:auto;
}
.right{
  flex:1;
  display:flex;
  flex-direction:column;
}
iframe{
  flex:1;
  border:none;
}
.bottom{
  padding:10px;
  border-top:1px solid #eee;
}
button{
  background:#f59e0b;
  border:none;
  padding:10px 15px;
  border-radius:6px;
  cursor:pointer;
}
</style>
</head>

<body>

<div class="topbar">🎮 Code Quest — Fix to Win</div>

<div class="container">

<div class="left">
  <h3 id="title"></h3>
  <p id="desc"></p>
</div>

<div class="right">
  <iframe id="editor"
    src="https://editor.learnwithchampak.live/python-starter/editor/super/?tmode=0">
  </iframe>

  <div class="bottom">
    <button onclick="check()">Check Answer</button>
    <span id="result"></span>
  </div>
</div>

</div>

<script>

const level = {
  title: "Fix Indentation",
  desc: "Print numbers from 1 to 5",
  expected: "1\n2\n3\n4\n5"
};

document.getElementById("title").innerText = level.title;
document.getElementById("desc").innerText = level.desc;

function check(){
  // Placeholder: later connect with editor output
  document.getElementById("result").innerText =
    "⚠️ Output checking coming in V2";
}

</script>

</body>
</html>
