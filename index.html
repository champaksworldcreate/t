<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Project 28: Hand Gesture Recognizer</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-core"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-backend-webgl"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/hand-pose-detection"></script>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #e9fbf7;
      color: #083c3c;
      text-align: center;
    }

    header {
      background: linear-gradient(135deg, #064e4e, #0b7777);
      color: white;
      padding: 25px;
    }

    h1 {
      margin: 0;
      font-size: 32px;
    }

    .box {
      max-width: 900px;
      margin: 20px auto;
      background: white;
      padding: 20px;
      border-radius: 18px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.12);
    }

    #stage {
      position: relative;
      width: 640px;
      height: 480px;
      max-width: 100%;
      margin: auto;
      border-radius: 16px;
      overflow: hidden;
      background: black;
    }

    video, canvas {
      position: absolute;
      left: 0;
      top: 0;
      width: 640px;
      height: 480px;
      max-width: 100%;
    }

    video {
      transform: scaleX(-1);
    }

    canvas {
      transform: scaleX(-1);
    }

    button {
      background: #087878;
      color: white;
      border: none;
      padding: 12px 20px;
      margin: 10px;
      border-radius: 12px;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #055d5d;
    }

    .result {
      font-size: 30px;
      font-weight: bold;
      margin: 15px;
      color: #064e4e;
    }

    .small {
      font-size: 15px;
      color: #335;
      line-height: 1.6;
    }
  </style>
</head>

<body>

<header>
  <h1>Project 28: Hand Gesture Recognizer</h1>
  <p>TensorFlow.js + MediaPipe Hands + Webcam</p>
</header>

<div class="box">
  <button onclick="startApp()">Start Camera</button>
  <button onclick="stopCamera()">Stop Camera</button>

  <div class="result" id="gestureResult">Gesture: Waiting...</div>

  <div id="stage">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="canvas"></canvas>
  </div>

  <p class="small">
    Supported gestures: Open Palm, Fist, Thumbs Up, Peace Sign, One Finger, Three Fingers, Four Fingers.
  </p>
</div>

<script>
  let video = document.getElementById("video");
  let canvas = document.getElementById("canvas");
  let ctx = canvas.getContext("2d");
  let resultBox = document.getElementById("gestureResult");

  let detector = null;
  let stream = null;
  let running = false;

  canvas.width = 640;
  canvas.height = 480;

  async function startApp() {
    resultBox.innerText = "Loading model...";

    await tf.setBackend("webgl");
    await tf.ready();

    const model = handPoseDetection.SupportedModels.MediaPipeHands;

    const detectorConfig = {
      runtime: "mediapipe",
      modelType: "full",
      maxHands: 1,
      solutionPath: "https://cdn.jsdelivr.net/npm/@mediapipe/hands"
    };

    detector = await handPoseDetection.createDetector(model, detectorConfig);

    stream = await navigator.mediaDevices.getUserMedia({
      video: {
        width: 640,
        height: 480
      },
      audio: false
    });

    video.srcObject = stream;

    video.onloadedmetadata = () => {
      video.play();
      running = true;
      detectHands();
    };

    resultBox.innerText = "Gesture: Show your hand";
  }

  function stopCamera() {
    running = false;

    if (stream) {
      stream.getTracks().forEach(track => track.stop());
    }

    ctx.clearRect(0, 0, canvas.width, canvas.height);
    resultBox.innerText = "Gesture: Camera stopped";
  }

  async function detectHands() {
    if (!running || !detector) return;

    const hands = await detector.estimateHands(video, {
      flipHorizontal: false
    });

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    if (hands.length > 0) {
      const hand = hands[0];
      const keypoints = hand.keypoints;

      drawHand(keypoints);

      const gesture = recognizeGesture(keypoints);
      resultBox.innerText = "Gesture: " + gesture;
    } else {
      resultBox.innerText = "Gesture: No hand detected";
    }

    requestAnimationFrame(detectHands);
  }

  function drawHand(keypoints) {
    ctx.fillStyle = "red";
    ctx.strokeStyle = "yellow";
    ctx.lineWidth = 3;

    for (let point of keypoints) {
      ctx.beginPath();
      ctx.arc(point.x, point.y, 6, 0, 2 * Math.PI);
      ctx.fill();
    }

    const connections = [
      [0,1],[1,2],[2,3],[3,4],
      [0,5],[5,6],[6,7],[7,8],
      [0,9],[9,10],[10,11],[11,12],
      [0,13],[13,14],[14,15],[15,16],
      [0,17],[17,18],[18,19],[19,20],
      [5,9],[9,13],[13,17]
    ];

    for (let pair of connections) {
      const p1 = keypoints[pair[0]];
      const p2 = keypoints[pair[1]];

      ctx.beginPath();
      ctx.moveTo(p1.x, p1.y);
      ctx.lineTo(p2.x, p2.y);
      ctx.stroke();
    }
  }

  function isFingerOpen(keypoints, tip, pip) {
    return keypoints[tip].y < keypoints[pip].y;
  }

  function isThumbOpen(keypoints) {
    return Math.abs(keypoints[4].x - keypoints[2].x) > 35;
  }

  function recognizeGesture(keypoints) {
    const thumb = isThumbOpen(keypoints);
    const index = isFingerOpen(keypoints, 8, 6);
    const middle = isFingerOpen(keypoints, 12, 10);
    const ring = isFingerOpen(keypoints, 16, 14);
    const pinky = isFingerOpen(keypoints, 20, 18);

    const openCount = [thumb, index, middle, ring, pinky].filter(Boolean).length;

    if (openCount === 5) {
      return "Open Palm";
    }

    if (openCount === 0) {
      return "Fist";
    }

    if (thumb && !index && !middle && !ring && !pinky) {
      return "Thumbs Up";
    }

    if (!thumb && index && middle && !ring && !pinky) {
      return "Peace Sign";
    }

    if (!thumb && index && !middle && !ring && !pinky) {
      return "One Finger";
    }

    if (!thumb && index && middle && ring && !pinky) {
      return "Three Fingers";
    }

    if (!thumb && index && middle && ring && pinky) {
      return "Four Fingers";
    }

    return "Unknown Gesture";
  }
</script>

</body>
</html>
