<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>M × N Grid Highlighter</title>

<style>
body{
    font-family: Arial, Helvetica, sans-serif;
    background: #eef8f8;
    text-align: center;
    margin: 20px;
}

h1{
    color: #00695c;
}

.controls{
    margin: 15px;
}

input{
    padding: 8px;
    font-size: 16px;
    text-align: center;
    border-radius: 6px;
    border: 1px solid #00897b;
}

button{
    padding: 8px 20px;
    font-size: 16px;
    cursor: pointer;
    background: #00897b;
    color: white;
    border: none;
    border-radius: 6px;
}

#rows, #cols{
    width: 80px;
}

#expression{
    width: 260px;
}

#grid{
    margin: 20px auto;
    display: grid;
    gap: 5px;
    justify-content: center;
}

.cell{
    width: 90px;
    height: 70px;
    border: 2px solid #00897b;
    background: white;
    border-radius: 8px;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 18px;
    font-weight: bold;
    color: #00695c;
}

.highlight{
    background: #ffd54f;
    border-color: #ff6f00;
    color: #000;
}
</style>
</head>
<body>

<h1>M × N Grid Highlighter</h1>

<div class="controls">
    Rows:
    <input type="number" id="rows" value="4" min="1">

    Columns:
    <input type="number" id="cols" value="5" min="1">

    <button onclick="makeGrid()">Generate Grid</button>
</div>

<div class="controls">
    Expression:
    <input type="text" id="expression" value="row=1 and col=4">
    <button onclick="highlightGrid()">Highlight</button>
</div>

<div id="grid"></div>

<script>
function makeGrid(){

    let rows = parseInt(document.getElementById("rows").value);
    let cols = parseInt(document.getElementById("cols").value);

    let grid = document.getElementById("grid");

    grid.innerHTML = "";

    grid.style.gridTemplateColumns = `repeat(${cols}, 90px)`;

    for(let row = 1; row <= rows; row++){

        for(let col = 1; col <= cols; col++){

            let cell = document.createElement("div");
            cell.className = "cell";

            cell.dataset.row = row;
            cell.dataset.col = col;

            cell.textContent = `(${row}, ${col})`;

            grid.appendChild(cell);
        }
    }

    highlightGrid();
}

function checkExpression(expression, row, col){

    expression = expression.toLowerCase();

    expression = expression.replaceAll("and", "&&");
    expression = expression.replaceAll("or", "||");

    expression = expression.replaceAll("row", row);
    expression = expression.replaceAll("col", col);

    expression = expression.replaceAll("=", "==");

    try{
        return eval(expression);
    }
    catch(error){
        return false;
    }
}

function highlightGrid(){

    let expression = document.getElementById("expression").value;
    let cells = document.querySelectorAll(".cell");

    cells.forEach(function(cell){

        let row = Number(cell.dataset.row);
        let col = Number(cell.dataset.col);

        cell.classList.remove("highlight");

        if(checkExpression(expression, row, col)){
            cell.classList.add("highlight");
        }
    });
}

makeGrid();
</script>

</body>
</html>
