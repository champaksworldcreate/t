<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>M × N Grid Highlighter</title>

<style>
*{
    box-sizing:border-box;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#eef8f8;
    margin:20px;
    text-align:center;
}

h1{
    color:#00695c;
}

.controls{
    margin:15px 0;
}

input{
    padding:8px;
    font-size:16px;
    border:1px solid #00897b;
    border-radius:6px;
    text-align:center;
}

#rows,#cols{
    width:80px;
}

#expression{
    width:360px;
    max-width:95%;
}

button{
    padding:8px 18px;
    font-size:16px;
    border:none;
    border-radius:6px;
    background:#00897b;
    color:white;
    cursor:pointer;
}

.grid-wrapper{
    width:95vw;
    max-height:70vh;
    overflow:auto;
    margin:auto;
    border:2px solid #00897b;
    border-radius:10px;
    padding:10px;
    background:white;
}

#grid{
    display:grid;
    gap:5px;
    justify-content:start;
}

.cell{
    width:90px;
    height:70px;
    border:2px solid #00897b;
    border-radius:8px;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:18px;
    font-weight:bold;
    background:white;
    color:#00695c;
    transition:.2s;
}

.highlight{
    background:gold;
    border-color:red;
    color:black;
}
</style>
</head>

<body>

<h1>M × N Grid Highlighter</h1>

<div class="controls">
Rows
<input type="number" id="rows" value="7" min="1">

Columns
<input type="number" id="cols" value="7" min="1">

<button onclick="makeGrid()">Generate Grid</button>
</div>

<div class="controls">
Expression

<input
type="text"
id="expression"
value="m==1 and n==4"
oninput="highlightGrid()"
placeholder="Example: m==1 and n==4">

</div>

<div class="grid-wrapper">
    <div id="grid"></div>
</div>

<script>

function makeGrid(){

    let rows=parseInt(document.getElementById("rows").value);
    let cols=parseInt(document.getElementById("cols").value);

    let grid=document.getElementById("grid");

    grid.innerHTML="";

    grid.style.gridTemplateColumns=`repeat(${cols},90px)`;

    for(let m=1;m<=rows;m++){

        for(let n=1;n<=cols;n++){

            let cell=document.createElement("div");

            cell.className="cell";

            cell.dataset.m=m;
            cell.dataset.n=n;

            cell.textContent=`(${m}, ${n})`;

            grid.appendChild(cell);

        }

    }

    highlightGrid();

}

function evaluateExpression(expression,m,n){

    expression=expression.toLowerCase();

    expression=expression.replace(/\band\b/g,"&&");
    expression=expression.replace(/\bor\b/g,"||");

    expression=expression.replace(/\brow\b/g,m);
    expression=expression.replace(/\bcol\b/g,n);

    expression=expression.replace(/\bm\b/g,m);
    expression=expression.replace(/\bn\b/g,n);

    // allow single =
    expression=expression.replace(/([^!<>=])=([^=])/g,"$1==$2");

    try{
        return Function("return ("+expression+")")();
    }
    catch(e){
        return false;
    }

}

function highlightGrid(){

    let expression=document.getElementById("expression").value;

    let cells=document.querySelectorAll(".cell");

    cells.forEach(function(cell){

        let m=Number(cell.dataset.m);
        let n=Number(cell.dataset.n);

        if(evaluateExpression(expression,m,n)){
            cell.classList.add("highlight");
        }
        else{
            cell.classList.remove("highlight");
        }

    });

}

makeGrid();

</script>

</body>
</html>
