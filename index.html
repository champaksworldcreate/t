
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Face Detection Stage-1 (Rectangle on Face)</title>

  <meta name="theme-color" content="#f59e0b" />
  <style>
    :root{
      --bg:#fff7e6; --card:#ffffffcc; --ink:#1f2937; --muted:#6b7280;
      --brand:#d97706; --brand2:#f59e0b; --border:#eadcc5;
      --shadow:0 18px 40px rgba(31,41,55,.14);
      --r:18px;
      --sans: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
    }
    *{box-sizing:border-box}
    body{
      margin:0; font-family:var(--sans); color:var(--ink);
      background:
        radial-gradient(900px 520px at 15% 10%, rgba(245,158,11,.22), transparent 60%),
        radial-gradient(900px 520px at 85% 0%, rgba(217,119,6,.18), transparent 60%),
        var(--bg);
    }
    .wrap{max-width:1000px;margin:0 auto;padding:14px}
    .top{
      display:flex;align-items:center;justify-content:space-between;gap:10px;
      padding:10px 12px;border-radius:999px;background:rgba(255,247,230,.72);
      border:1px solid rgba(234,220,197,.95); box-shadow: 0 10px 24px rgba(31,41,55,.10);
      position:sticky; top:0; z-index:5; backdrop-filter: blur(10px);
    }
    .title{display:flex;align-items:center;gap:10px}
    .logo{
      width:34px;height:34px;border-radius:12px;
      background: linear-gradient(135deg, var(--brand), var(--brand2));
      box-shadow: 0 12px 26px rgba(217,119,6,.28);
    }
    h1{margin:0;font-size:14px;line-height:1.1}
    .sub{font-size:12px;color:var(--muted);margin-top:2px}
    .btn{
      border-radius:12px; border:1px solid rgba(234,220,197,.95);
      background:#fff; padding:10px 12px; font-size:13px; cursor:pointer;
      box-shadow: 0 10px 22px rgba(31,41,55,.08);
    }
    .btn.primary{
      background: linear-gradient(135deg, var(--brand), var(--brand2));
      color:#fff; border-color: rgba(217,119,6,.35);
      box-shadow: 0 14px 30px rgba(217,119,6,.22);
    }
    .btn:disabled{opacity:.55;cursor:not-allowed}
    .card{
      margin-top:12px;
      background:var(--card);
      border:1px solid rgba(234,220,197,.95);
      border-radius:var(--r);
      box-shadow: var(--shadow);
      overflow:hidden;
    }
    .card-h{
      padding:12px 12px 10px 12px;
      border-bottom:1px solid rgba(234,220,197,.8);
      display:flex;align-items:center;justify-content:space-between;gap:10px;
      flex-wrap:wrap;
    }
    .pill{
      font-size:12px;padding:6px 10px;border-radius:999px;
      background: rgba(245,158,11,.16);
      border:1px solid rgba(217,119,6,.22);
      color:#92400e;
    }
    .stage{
      position:relative;
      background:#0b1220;
      border-radius: 16px;
      overflow:hidden;
    }
    video{
      width:100%; height:auto; display:block;
      transform: scaleX(-1);
    }
    canvas{
      position:absolute; inset:0;
      width:100%; height:100%;
      pointer-events:none;
    }
    .controls{
      padding:12px;
      display:flex; gap:10px; flex-wrap:wrap; align-items:center;
    }
    .toggle{
      display:flex;align-items:center;gap:8px;
      padding:8px 10px;border-radius:14px;
      border:1px solid rgba(234,220,197,.95);
      background: rgba(255,255,255,.75);
      font-size:12px;color:var(--ink);
    }
    .toggle input{transform:scale(1.15)}
    .note{
      margin:12px;
      padding:10px 12px;border-radius:14px;
      border:1px solid rgba(245,158,11,.35);
      background: rgba(245,158,11,.14);
      color:#7c2d12;
      font-size:12px;
    }
  </style>

  <!-- Face API (vladmandic fork) -->
  <script defer src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1/dist/face-api.js"></script>
</head>
<body>
  <div class="wrap">
    <div class="top">
      <div class="title">
        <div class="logo" aria-hidden="true"></div>
        <div>
          <h1>Face Detection Stage-1</h1>
          <div class="sub">Webcam + Canvas overlay → rectangle on face</div>
        </div>
      </div>
      <span class="pill" id="status">Loading models…</span>
    </div>

    <div class="card">
      <div class="card-h">
        <div class="sub" style="margin:0">
          Tip: Best results in good light. Use HTTPS (GitHub Pages).
        </div>
        <div style="display:flex;gap:10px;flex-wrap:wrap">
          <button class="btn primary" id="startBtn" disabled>Start</button>
          <button class="btn" id="stopBtn" disabled>Stop</button>
        </div>
      </div>

      <div class="controls">
        <label class="toggle" title="Mirror video for front camera feel">
          <input type="checkbox" id="mirror" checked /> Mirror
        </label>
        <label class="toggle" title="Front camera on phone (user) vs back camera (environment)">
          <input type="checkbox" id="useBackCam" /> Use Back Camera
        </label>
        <label class="toggle" title="Increase or decrease detection strictness">
          <span style="color:#6b7280">Score ≥</span>
          <select id="score" class="btn" style="padding:8px 10px">
            <option value="0.35">0.35 (loose)</option>
            <option value="0.5" selected>0.50 (default)</option>
            <option value="0.65">0.65 (strict)</option>
          </select>
        </label>
      </div>

      <div class="stage" id="stage">
        <video id="video" playsinline muted></video>
        <canvas id="overlay"></canvas>
      </div>

      <div class="note">
        If camera doesn’t open on phone: host this on <b>GitHub Pages</b> (HTTPS), then open the Pages URL.
      </div>
    </div>
  </div>

<script>
(() => {
  const MODEL_BASE = "https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.15/model/";

  const video = document.getElementById("video");
  const canvas = document.getElementById("overlay");
  const statusEl = document.getElementById("status");

  const startBtn = document.getElementById("startBtn");
  const stopBtn  = document.getElementById("stopBtn");
  const mirrorCb = document.getElementById("mirror");
  const backCb   = document.getElementById("useBackCam");
  const scoreSel = document.getElementById("score");

  let stream = null;
  let running = false;
  let rafId = null;

  function setStatus(txt){ statusEl.textContent = txt; }

  function setMirror(on){
    video.style.transform = on ? "scaleX(-1)" : "none";
  }
  mirrorCb.addEventListener("change", () => setMirror(mirrorCb.checked));
  setMirror(true);

  function resizeCanvas(){
    const w = video.videoWidth || video.clientWidth;
    const h = video.videoHeight || video.clientHeight;
    if (!w || !h) return;
    if (canvas.width !== w) canvas.width = w;
    if (canvas.height !== h) canvas.height = h;
  }

  function tinyOptions(){
    return new faceapi.TinyFaceDetectorOptions({
      inputSize: 320,
      scoreThreshold: Number(scoreSel.value || 0.5)
    });
  }

  async function loadModels(){
    setStatus("Loading models…");
    // wait for faceapi script to be ready
    for (let i=0;i<80;i++){
      if (window.faceapi) break;
      await new Promise(r => setTimeout(r, 50));
    }
    if (!window.faceapi) throw new Error("face-api failed to load (CDN blocked/offline).");

    await faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_BASE);
    setStatus("Models loaded ✓  Tap Start");
    startBtn.disabled = false;
  }

  async function start(){
    if (running) return;
    try{
      setStatus("Requesting camera…");
      const facingMode = backCb.checked ? "environment" : "user";
      stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode },
        audio: false
      });
      video.srcObject = stream;
      await video.play();

      resizeCanvas();
      window.addEventListener("resize", resizeCanvas);

      running = true;
      startBtn.disabled = true;
      stopBtn.disabled = false;
      setStatus("Running ✓  Face box should appear");

      loop();
    }catch(err){
      setStatus("Camera blocked ✗");
      alert(
        "Camera did not start.\n\nFix:\n1) Use HTTPS (GitHub Pages) or localhost.\n2) Allow camera permission.\n3) Close other apps using camera.\n\nDetails: " +
        (err?.message || err)
      );
    }
  }

  function stop(){
    running = false;
    if (rafId) cancelAnimationFrame(rafId);
    rafId = null;

    if (stream){
      stream.getTracks().forEach(t => t.stop());
      stream = null;
    }
    video.srcObject = null;

    const ctx = canvas.getContext("2d");
    ctx.clearRect(0,0,canvas.width,canvas.height);

    startBtn.disabled = false;
    stopBtn.disabled = true;
    setStatus("Stopped");
  }

  async function loop(){
    if (!running) return;

    resizeCanvas();
    const ctx = canvas.getContext("2d");
    ctx.clearRect(0,0,canvas.width,canvas.height);

    // Draw mirrored overlay if video is mirrored
    ctx.save();
    if (mirrorCb.checked){
      ctx.translate(canvas.width, 0);
      ctx.scale(-1, 1);
    }

    const detections = await faceapi.detectAllFaces(video, tinyOptions());

    // Rectangle style
    ctx.lineWidth = 3;
    ctx.strokeStyle = "rgba(245,158,11,.95)";
    ctx.fillStyle   = "rgba(245,158,11,.12)";

    for (const d of detections){
      const b = d.box; // x,y,width,height
      roundRect(ctx, b.x, b.y, b.width, b.height, 10, true, true);
    }

    ctx.restore();
    rafId = requestAnimationFrame(loop);
  }

  function roundRect(ctx, x, y, w, h, r, fill, stroke){
    const rr = Math.min(r, w/2, h/2);
    ctx.beginPath();
    ctx.moveTo(x+rr, y);
    ctx.arcTo(x+w, y, x+w, y+h, rr);
    ctx.arcTo(x+w, y+h, x, y+h, rr);
    ctx.arcTo(x, y+h, x, y, rr);
    ctx.arcTo(x, y, x+w, y, rr);
    ctx.closePath();
    if (fill) ctx.fill();
    if (stroke) ctx.stroke();
  }

  startBtn.addEventListener("click", start);
  stopBtn.addEventListener("click", stop);

  // Hotkeys (optional on desktop)
  document.addEventListener("keydown", (e) => {
    if (e.key === " "){
      e.preventDefault();
      running ? stop() : start();
    }
  });

  // Init
  if (!navigator.mediaDevices?.getUserMedia){
    setStatus("Browser unsupported ✗");
    alert("This browser does not support camera access. Try Chrome on Android.");
    return;
  }

  loadModels().catch(err => {
    setStatus("Model load failed ✗");
    alert(
      "Models could not be loaded.\n\nPossible reasons:\n- No internet / CDN blocked\n- Adblock blocks jsdelivr\n\nDetails: " + (err?.message || err)
    );
  });
})();
</script>
</body>
</html>
