<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Programmer's Picnic Search Centre</title>

  <style>
    :root{
      --bg:#fff7e6;
      --bg2:#fff1c7;
      --card:#ffffff;
      --text:#1f1608;
      --muted:#6b4a1d;
      --brand:#d97706;
      --brand2:#f59e0b;
      --line:#f3c76f;
      --soft:#fffaf0;
      --shadow:0 25px 70px rgba(120,72,0,.16);
      --radius:28px;
    }

    *{box-sizing:border-box}

    body{
      margin:0;
      min-height:100vh;
      font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      color:var(--text);
      background:
        radial-gradient(circle at top left, rgba(245,158,11,.30), transparent 35%),
        radial-gradient(circle at bottom right, rgba(217,119,6,.22), transparent 38%),
        linear-gradient(135deg,var(--bg),var(--soft));
      display:flex;
      align-items:center;
      justify-content:center;
      padding:24px;
    }

    .search-centre{
      width:min(1120px,100%);
      background:rgba(255,255,255,.82);
      backdrop-filter:blur(18px);
      border:1px solid rgba(243,199,111,.9);
      border-radius:36px;
      box-shadow:var(--shadow);
      overflow:hidden;
    }

    .hero{
      padding:38px;
      background:
        linear-gradient(135deg,rgba(217,119,6,.16),rgba(245,158,11,.08)),
        #fff;
      border-bottom:1px solid var(--line);
      text-align:center;
    }

    .badge{
      display:inline-flex;
      gap:8px;
      align-items:center;
      background:var(--bg2);
      border:1px solid var(--line);
      padding:8px 14px;
      border-radius:999px;
      color:#7c4700;
      font-size:14px;
      font-weight:700;
    }

    h1{
      margin:18px 0 10px;
      font-size:clamp(32px,5vw,64px);
      line-height:1.02;
      letter-spacing:-2px;
    }

    .hero p{
      margin:0 auto;
      max-width:720px;
      color:var(--muted);
      font-size:18px;
      line-height:1.6;
    }

    .search-box{
      margin:30px auto 0;
      max-width:820px;
      display:flex;
      gap:12px;
      background:#fff;
      border:2px solid var(--line);
      border-radius:999px;
      padding:10px;
      box-shadow:0 14px 35px rgba(217,119,6,.12);
    }

    .search-box input{
      flex:1;
      border:0;
      outline:0;
      font-size:18px;
      padding:15px 20px;
      background:transparent;
      color:var(--text);
    }

    .search-box button{
      border:0;
      background:linear-gradient(135deg,var(--brand),var(--brand2));
      color:white;
      font-weight:800;
      padding:14px 24px;
      border-radius:999px;
      cursor:pointer;
      box-shadow:0 10px 25px rgba(217,119,6,.28);
    }

    .panel{
      padding:28px;
      display:grid;
      grid-template-columns:260px 1fr;
      gap:24px;
    }

    .filters,
    .results-wrap{
      background:#fff;
      border:1px solid var(--line);
      border-radius:var(--radius);
      padding:22px;
    }

    .filters h2,
    .results-head h2{
      margin:0 0 14px;
      font-size:20px;
    }

    .filter-btn{
      width:100%;
      border:1px solid var(--line);
      background:var(--soft);
      color:var(--text);
      padding:12px 14px;
      border-radius:16px;
      margin-bottom:10px;
      cursor:pointer;
      text-align:left;
      font-weight:700;
    }

    .filter-btn.active{
      background:linear-gradient(135deg,var(--brand),var(--brand2));
      color:#fff;
      border-color:transparent;
    }

    .results-head{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:12px;
      margin-bottom:18px;
    }

    .count{
      color:var(--muted);
      font-weight:700;
      font-size:14px;
    }

    .results{
      display:grid;
      gap:16px;
    }

    .card{
      border:1px solid #f4d28c;
      border-radius:22px;
      padding:20px;
      background:
        linear-gradient(135deg,rgba(255,250,240,.96),rgba(255,255,255,.96));
      transition:.25s ease;
    }

    .card:hover{
      transform:translateY(-3px);
      box-shadow:0 18px 40px rgba(120,72,0,.13);
    }

    .card-top{
      display:flex;
      justify-content:space-between;
      gap:12px;
      align-items:flex-start;
    }

    .card h3{
      margin:0;
      font-size:21px;
    }

    .type{
      background:var(--bg2);
      color:#8a4d00;
      border:1px solid var(--line);
      border-radius:999px;
      padding:5px 10px;
      font-size:12px;
      font-weight:800;
      white-space:nowrap;
    }

    .card p{
      margin:10px 0 14px;
      color:var(--muted);
      line-height:1.55;
    }

    .tags{
      display:flex;
      flex-wrap:wrap;
      gap:8px;
      margin-bottom:14px;
    }

    .tag{
      background:#fff1c7;
      color:#714000;
      padding:6px 10px;
      border-radius:999px;
      font-size:12px;
      font-weight:700;
    }

    .card a{
      display:inline-flex;
      text-decoration:none;
      background:#1f1608;
      color:#fff;
      padding:10px 14px;
      border-radius:14px;
      font-weight:800;
    }

    .empty{
      text-align:center;
      padding:40px 16px;
      color:var(--muted);
      border:1px dashed var(--line);
      border-radius:22px;
      background:var(--soft);
    }

    mark{
      background:#fde68a;
      color:#1f1608;
      border-radius:5px;
      padding:0 3px;
    }

    @media(max-width:800px){
      body{
        align-items:flex-start;
      }

      .hero{
        padding:28px 18px;
      }

      .search-box{
        border-radius:24px;
        flex-direction:column;
      }

      .search-box button{
        width:100%;
      }

      .panel{
        grid-template-columns:1fr;
        padding:18px;
      }

      .results-head{
        align-items:flex-start;
        flex-direction:column;
      }
    }
  </style>
</head>

<body>
  <main class="search-centre">
    <section class="hero">
      <div class="badge">Programmer's Picnic Search Centre</div>

      <h1>Find lessons, tools, projects and notes instantly.</h1>

      <p>
        A beautiful JSON-powered search system using fetch. Add your data in one
        or more JSON files and this centre page will search everything.
      </p>

      <form class="search-box" id="searchForm">
        <input
          id="searchInput"
          type="search"
          placeholder="Search Python, NumPy, Firebase, Flutter, DNS..."
          autocomplete="off"
        />
        <button type="submit">Search</button>
      </form>
    </section>

    <section class="panel">
      <aside class="filters">
        <h2>Filter</h2>
        <button class="filter-btn active" data-filter="all">All</button>
        <button class="filter-btn" data-filter="lesson">Lessons</button>
        <button class="filter-btn" data-filter="tool">Tools</button>
        <button class="filter-btn" data-filter="project">Projects</button>
        <button class="filter-btn" data-filter="note">Notes</button>
      </aside>

      <section class="results-wrap">
        <div class="results-head">
          <h2>Search Results</h2>
          <div class="count" id="resultCount">Loading data...</div>
        </div>

        <div class="results" id="results"></div>
      </section>
    </section>
  </main>

  <script>
    const DATA_FILES = [
      "data/search-lessons.json",
      "data/search-tools.json"
    ];

    let allItems = [];
    let activeFilter = "all";

    const input = document.getElementById("searchInput");
    const results = document.getElementById("results");
    const resultCount = document.getElementById("resultCount");
    const form = document.getElementById("searchForm");
    const filterButtons = document.querySelectorAll(".filter-btn");

    async function loadData() {
      try {
        const responses = await Promise.all(
          DATA_FILES.map(file => fetch(file))
        );

        const jsonFiles = await Promise.all(
          responses.map(response => {
            if (!response.ok) {
              throw new Error("Could not load JSON file");
            }
            return response.json();
          })
        );

        allItems = jsonFiles.flatMap(file => file.items || []);
        renderResults();
      } catch (error) {
        results.innerHTML = `
          <div class="empty">
            Could not load search data. Please check your JSON file path.
          </div>
        `;
        resultCount.textContent = "Data loading failed";
      }
    }

    function normalize(text) {
      return String(text || "").toLowerCase().trim();
    }

    function highlight(text, query) {
      if (!query) return text;

      const safeQuery = query.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
      const regex = new RegExp(`(${safeQuery})`, "gi");

      return String(text).replace(regex, "<mark>$1</mark>");
    }

    function searchItems() {
      const query = normalize(input.value);

      return allItems.filter(item => {
        const matchesFilter =
          activeFilter === "all" || item.type === activeFilter;

        const searchableText = normalize(`
          ${item.title}
          ${item.description}
          ${item.type}
          ${(item.tags || []).join(" ")}
        `);

        const matchesSearch =
          !query || searchableText.includes(query);

        return matchesFilter && matchesSearch;
      });
    }

    function renderResults() {
      const query = input.value.trim();
      const filteredItems = searchItems();

      resultCount.textContent =
        `${filteredItems.length} result${filteredItems.length !== 1 ? "s" : ""} found`;

      if (!filteredItems.length) {
        results.innerHTML = `
          <div class="empty">
            No result found. Try another keyword.
          </div>
        `;
        return;
      }

      results.innerHTML = filteredItems.map(item => `
        <article class="card">
          <div class="card-top">
            <h3>${highlight(item.title, query)}</h3>
            <span class="type">${item.type}</span>
          </div>

          <p>${highlight(item.description, query)}</p>

          <div class="tags">
            ${(item.tags || []).map(tag => `
              <span class="tag">${highlight(tag, query)}</span>
            `).join("")}
          </div>

          <a href="${item.url}" target="champak">Open</a>
        </article>
      `).join("");
    }

    form.addEventListener("submit", event => {
      event.preventDefault();
      renderResults();
    });

    input.addEventListener("input", renderResults);

    filterButtons.forEach(button => {
      button.addEventListener("click", () => {
        filterButtons.forEach(btn => btn.classList.remove("active"));
        button.classList.add("active");
        activeFilter = button.dataset.filter;
        renderResults();
      });
    });

    loadData();
  </script>
</body>
</html>
