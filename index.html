<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Sorting Identifier V6 Ultra | Programmer's Picnic</title>

<script src="https://programmer-s-picnic.github.io/json-images/find-on-page.js"></script>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#fffaf0;
  color:#2b2112;
}
.wrap{max-width:1100px;margin:auto;padding:20px}

textarea{
  width:100%;
  height:200px;
  padding:12px;
  border-radius:10px;
  border:1px solid #f1d7a8;
}

button{
  margin:8px 5px 0 0;
  padding:10px 16px;
  border-radius:999px;
  border:0;
  background:#f59e0b;
  color:#fff;
  font-weight:bold;
  cursor:pointer;
}

.card{
  margin-top:15px;
  padding:15px;
  background:#fff;
  border-radius:12px;
  border:1px solid #f1d7a8;
}

.result{
  font-size:28px;
  font-weight:900;
  color:#d97706;
}

.barrow{
  display:flex;
  gap:6px;
  margin:8px 0;
}

.bar{
  min-width:40px;
  background:#f59e0b;
  color:#fff;
  display:flex;
  justify-content:center;
  align-items:flex-end;
  border-radius:6px;
}

.correct{outline:3px solid green}
.wrong{outline:3px solid red}

.good{color:green;font-weight:bold}
.bad{color:red;font-weight:bold}

.explain{
  background:#fff8e6;
  padding:10px;
  border-radius:10px;
  margin-top:10px;
}
</style>
</head>

<body>
<div class="wrap">

<h1 data-pp-speak-title>Sorting Algorithm Identifier — V6 Ultra</h1>

<textarea id="input">Start: [5,1,4,2,8]
Pass1:[1,4,2,5,8]
Pass2:[1,2,4,5,8]</textarea>

<button onclick="identify()">Identify</button>
<button onclick="play()">Animate</button>

<div class="card">
<div id="result" class="result">Waiting...</div>
<div id="reason"></div>
</div>

<div class="card" id="scores"></div>
<div class="card" id="viz"></div>
<div class="card" id="explain"></div>

</div>

<script>

/* -------- PARSE -------- */
function parse(text){
  return text.split("\n")
    .map(l=>l.match(/\[(.*?)\]/))
    .filter(Boolean)
    .map(m=>m[1].split(",").map(x=>+x));
}

function same(a,b){
  return a.length===b.length && a.every((v,i)=>v===b[i]);
}

/* -------- SORTS -------- */
function bubble(a){a=[...a];let s=[];for(let i=0;i<a.length;i++){for(let j=0;j<a.length-1-i;j++){if(a[j]>a[j+1])[a[j],a[j+1]]=[a[j+1],a[j]]}s.push([...a])}return s}
function selection(a){a=[...a];let s=[];for(let i=0;i<a.length;i++){let m=i;for(let j=i+1;j<a.length;j++){if(a[j]<a[m])m=j}[a[i],a[m]]=[a[m],a[i]];s.push([...a])}return s}
function insertion(a){a=[...a];let s=[];for(let i=1;i<a.length;i++){let k=a[i],j=i-1;while(j>=0&&a[j]>k){a[j+1]=a[j];j--}a[j+1]=k;s.push([...a])}return s}
function counting(a){if(a.some(x=>x<0))return[];let max=Math.max(...a),c=Array(max+1).fill(0),arr=[...a],s=[];for(let x of arr)c[x]++;let i=0;for(let v=0;v<c.length;v++){while(c[v]--){arr[i++]=v;s.push([...arr])}}return s}
function radix(a){if(a.some(x=>x<0))return[];let arr=[...a],s=[],max=Math.max(...a);for(let exp=1;Math.floor(max/exp)>0;exp*=10){let b=Array.from({length:10},()=>[]);for(let x of arr)b[Math.floor(x/exp)%10].push(x);arr=[].concat(...b);s.push([...arr])}return s}

/* -------- SCORE -------- */
function score(exp,act){
  let a=act.slice(1),p=0;
  for(let i=0;i<a.length;i++){
    if(exp[i]&&same(exp[i],a[i]))p++;
  }
  return Math.round(p/a.length*100);
}

/* -------- AI EXPLANATION -------- */
function explainSteps(steps){
  let txt="";
  for(let i=1;i<steps.length;i++){
    txt+=`<div class="explain">Step ${i}: `;
    if(JSON.stringify(steps[i])===JSON.stringify([...steps[i]].sort((a,b)=>a-b))){
      txt+="Array is sorted or nearly sorted.";
    }else{
      txt+="Elements are being repositioned — likely comparing/swapping.";
    }
    txt+="</div>";
  }
  return txt;
}

/* -------- IDENTIFY -------- */
function identify(){

  let steps=parse(document.getElementById("input").value);
  if(steps.length<2)return;

  let start=steps[0];

  let algos={
    "Bubble":bubble(start),
    "Selection":selection(start),
    "Insertion":insertion(start),
    "Counting":counting(start),
    "Radix":radix(start)
  };

  let res=Object.entries(algos).map(([n,e])=>({
    name:n,
    exp:e,
    score:score(e,steps)
  })).sort((a,b)=>b.score-a.score);

  let best=res[0];

  document.getElementById("result").innerText=best.name+" Sort";

  document.getElementById("reason").innerText={
    Bubble:"Largest bubbles to right",
    Selection:"Min selected",
    Insertion:"Sorted grows",
    Counting:"Frequency based",
    Radix:"Digit sorting"
  }[best.name];

  document.getElementById("scores").innerHTML=
    res.map(r=>`${r.name}: <span class="${r.score>60?'good':'bad'}">${r.score}%</span>`).join("<br>");

  visualize(steps,best.exp);
  document.getElementById("explain").innerHTML=explainSteps(steps);
}

/* -------- VISUAL WITH ERROR DETECTION -------- */
function visualize(steps,expected){
  let max=Math.max(...steps.flat());

  document.getElementById("viz").innerHTML=
    steps.map((a,i)=>{

      let cls="";
      if(expected && i>0){
        cls = same(a,expected[i-1]) ? "correct" : "wrong";
      }

      return `
        <div class="${cls}">
        <h3>${i===0?"Start":"Pass "+i}</h3>
        <div class="barrow">
          ${a.map(x=>`<div class="bar" style="height:${40+(x/max)*120}px">${x}</div>`).join("")}
        </div>
        </div>
      `;
    }).join("");
}

/* -------- ANIMATION -------- */
function play(){
  let steps=parse(document.getElementById("input").value);
  let i=0;

  let t=setInterval(()=>{
    visualize([steps[i]]);
    i++;
    if(i>=steps.length)clearInterval(t);
  },800);
}

identify();

</script>

</body>
</html>
