<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>M × N Boolean Grid Highlighter</title>

<style>
body{
    font-family:Arial,Helvetica,sans-serif;
    background:#eef8f8;
    text-align:center;
    margin:20px;
}
h1{color:#00695c;}
.controls{margin:15px 0;}
input{
    padding:8px;
    font-size:16px;
    border:1px solid #00897b;
    border-radius:6px;
}
#rows,#cols{width:80px;text-align:center;}
#expression{width:420px;max-width:95%;}
button{
    padding:8px 18px;
    font-size:16px;
    background:#00897b;
    color:white;
    border:none;
    border-radius:6px;
    cursor:pointer;
}
.grid-wrapper{
    width:95vw;
    max-height:70vh;
    overflow:auto;
    margin:auto;
    border:2px solid #00897b;
    border-radius:10px;
    padding:10px;
    background:white;
}
#grid{
    display:grid;
    gap:5px;
    justify-content:start;
}
.cell{
    width:90px;
    height:70px;
    border:2px solid #00897b;
    border-radius:8px;
    display:flex;
    justify-content:center;
    align-items:center;
    font-weight:bold;
    color:#00695c;
    background:white;
}
.highlight{
    background:gold;
    border-color:red;
    color:black;
}
#error{
    color:red;
    font-weight:bold;
    min-height:24px;
}
</style>
</head>

<body>

<h1>M × N Boolean Grid Highlighter</h1>

<div class="controls">
Rows:
<input type="number" id="rows" value="7" min="1">

Columns:
<input type="number" id="cols" value="7" min="1">

<button onclick="makeGrid()">Generate Grid</button>
</div>

<div class="controls">
Expression:
<input
    type="text"
    id="expression"
    value="row = 1 and col = n"
    oninput="highlightGrid()"
    placeholder="Example: row = 1 and col = n">
</div>

<div id="error"></div>

<div class="grid-wrapper">
    <div id="grid"></div>
</div>

<script>
let totalRows = 7;
let totalCols = 7;

function makeGrid(){
    totalRows = Number(document.getElementById("rows").value);
    totalCols = Number(document.getElementById("cols").value);

    const grid = document.getElementById("grid");
    grid.innerHTML = "";
    grid.style.gridTemplateColumns = `repeat(${totalCols}, 90px)`;

    for(let row = 1; row <= totalRows; row++){
        for(let col = 1; col <= totalCols; col++){
            const cell = document.createElement("div");
            cell.className = "cell";
            cell.dataset.row = row;
            cell.dataset.col = col;
            cell.textContent = `(${row}, ${col})`;
            grid.appendChild(cell);
        }
    }

    highlightGrid();
}

function tokenize(text){
    return text
        .toLowerCase()
        .replace(/<=|>=|!=|=|<|>|\(|\)|\+|-|\*|\/|%/g, " $& ")
        .trim()
        .split(/\s+/)
        .filter(x => x.length > 0);
}

function valueOf(token, row, col){
    if(token === "row") return row;
    if(token === "col") return col;
    if(token === "m") return totalRows;
    if(token === "n") return totalCols;
    if(!isNaN(Number(token))) return Number(token);
    throw "Unknown word: " + token;
}

function evaluate(expression, row, col){
    const tokens = tokenize(expression);
    let i = 0;

    function peek(){ return tokens[i]; }
    function next(){ return tokens[i++]; }

    function numberExpression(){
        let value = term();

        while(peek() === "+" || peek() === "-"){
            let op = next();
            let right = term();

            if(op === "+") value += right;
            if(op === "-") value -= right;
        }

        return value;
    }

    function term(){
        let value = factor();

        while(peek() === "*" || peek() === "/" || peek() === "%"){
            let op = next();
            let right = factor();

            if(op === "*") value *= right;
            if(op === "/") value /= right;
            if(op === "%") value %= right;
        }

        return value;
    }

    function factor(){
        if(peek() === "("){
            next();
            let result = boolExpression();

            if(next() !== ")"){
                throw "Missing closing bracket";
            }

            return result;
        }

        return valueOf(next(), row, col);
    }

    function comparison(){
        let left = numberExpression();
        let op = next();
        let right = numberExpression();

        if(op === "=") return left === right;
        if(op === "!=") return left !== right;
        if(op === "<") return left < right;
        if(op === ">") return left > right;
        if(op === "<=") return left <= right;
        if(op === ">=") return left >= right;

        throw "Use a Boolean comparison like row = 1";
    }

    function boolFactor(){
        if(peek() === "not"){
            next();
            return !boolFactor();
        }

        if(peek() === "("){
            next();
            let result = boolExpression();

            if(next() !== ")"){
                throw "Missing closing bracket";
            }

            return result;
        }

        return comparison();
    }

    function boolTerm(){
        let result = boolFactor();

        while(peek() === "and"){
            next();
            result = result && boolFactor();
        }

        return result;
    }

    function boolExpression(){
        let result = boolTerm();

        while(peek() === "or"){
            next();
            result = result || boolTerm();
        }

        return result;
    }

    let answer = boolExpression();

    if(i < tokens.length){
        throw "Extra text found: " + tokens[i];
    }

    return answer;
}

function highlightGrid(){
    const expression = document.getElementById("expression").value;
    const cells = document.querySelectorAll(".cell");
    const errorBox = document.getElementById("error");

    errorBox.textContent = "";

    cells.forEach(cell => {
        const row = Number(cell.dataset.row);
        const col = Number(cell.dataset.col);

        try{
            if(evaluate(expression, row, col)){
                cell.classList.add("highlight");
            }else{
                cell.classList.remove("highlight");
            }
        }
        catch(error){
            cell.classList.remove("highlight");
            errorBox.textContent = error;
        }
    });
}

makeGrid();
</script>

</body>
</html>
