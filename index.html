<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Face Detection – Debug Safe</title>

<style>
  body{margin:0;background:#111;font-family:system-ui}
  .wrap{max-width:900px;margin:auto;padding:10px}
  video,canvas{width:100%;display:block}
  .stage{position:relative}
  canvas{position:absolute;left:0;top:0}
  button{
    padding:10px 14px;
    font-size:16px;
    margin:10px 0;
  }
</style>

<!-- Face API -->
<script defer src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1/dist/face-api.js"></script>
</head>

<body>
<div class="wrap">
  <button id="start">START CAMERA</button>

  <div class="stage">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="canvas"></canvas>
  </div>
</div>

<script>
const MODEL_URL = "https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.15/model/";
const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const startBtn = document.getElementById("start");

let stream;

async function loadModels(){
  await faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL);
  console.log("Models loaded");
}

function resizeCanvas(){
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
}

async function startCamera(){
  stream = await navigator.mediaDevices.getUserMedia({
    video:{facingMode:"user"},
    audio:false
  });
  video.srcObject = stream;

  await new Promise(r => video.onloadedmetadata = r);
  resizeCanvas();

  detectLoop();
}

async function detectLoop(){
  ctx.clearRect(0,0,canvas.width,canvas.height);

  const detection = await faceapi.detectSingleFace(
    video,
    new faceapi.TinyFaceDetectorOptions({
      inputSize: 320,
      scoreThreshold: 0.2   // VERY LOOSE
    })
  );

  if(detection){
    const b = detection.box;

    // 🔴 BIG RED DEBUG RECTANGLE
    ctx.strokeStyle = "red";
    ctx.lineWidth = 4;
    ctx.strokeRect(b.x, b.y, b.width, b.height);
  }

  requestAnimationFrame(detectLoop);
}

startBtn.onclick = async ()=>{
  startBtn.disabled = true;
  await loadModels();
  await startCamera();
};
</script>
</body>
</html>
