<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Programmer's Picnic — Dummy AWS Lab</title>
  <meta name="description" content="A practice AWS-style lab UI for learning EC2, S3, Lambda, and API Gateway concepts without using a real cloud account." />
  <meta name="theme-color" content="#f59e0b" />
  <style>
    :root{
      --bg: #fffaf0;
      --bg2: #fff4db;
      --panel: rgba(255,255,255,0.82);
      --panel-strong: rgba(255,255,255,0.95);
      --text: #1f2937;
      --muted: #6b7280;
      --brand: #d97706;
      --brand-2: #f59e0b;
      --brand-3: #fbbf24;
      --line: #ecd9b0;
      --ok: #15803d;
      --warn: #b45309;
      --bad: #b91c1c;
      --shadow: 0 18px 50px rgba(217,119,6,0.14);
      --radius: 22px;
      --radius-sm: 16px;
      --terminal: #111827;
      --terminal-text: #d1fae5;
    }

    *{ box-sizing:border-box; }

    html,body{
      margin:0;
      padding:0;
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      color:var(--text);
      background:
        radial-gradient(circle at top left, rgba(251,191,36,0.24), transparent 22%),
        radial-gradient(circle at top right, rgba(245,158,11,0.16), transparent 22%),
        linear-gradient(180deg, var(--bg), var(--bg2));
      min-height:100%;
    }

    button, input, textarea, select{
      font: inherit;
    }

    .app{
      max-width: 1500px;
      margin: 0 auto;
      padding: 20px;
    }

    .hero{
      background: linear-gradient(135deg, rgba(255,255,255,0.95), rgba(255,248,235,0.92));
      border:1px solid var(--line);
      border-radius: 28px;
      padding: 24px;
      box-shadow: var(--shadow);
      position: relative;
      overflow: hidden;
    }

    .hero::after{
      content:"";
      position:absolute;
      inset:auto -40px -40px auto;
      width:220px;
      height:220px;
      border-radius:50%;
      background: radial-gradient(circle, rgba(245,158,11,0.18), transparent 70%);
      pointer-events:none;
    }

    .topbar{
      display:flex;
      gap:14px;
      justify-content:space-between;
      align-items:flex-start;
      flex-wrap:wrap;
    }

    .brand-wrap{
      display:flex;
      gap:16px;
      align-items:center;
    }

    .logo{
      width:64px;
      height:64px;
      border-radius:18px;
      display:grid;
      place-items:center;
      font-weight:800;
      font-size:24px;
      color:#fff;
      background: linear-gradient(135deg, var(--brand), var(--brand-2));
      box-shadow: 0 12px 30px rgba(217,119,6,0.3);
      flex: 0 0 auto;
    }

    .hero h1{
      margin:0;
      font-size: clamp(1.5rem, 3vw, 2.4rem);
      line-height:1.15;
    }

    .hero p{
      margin:8px 0 0;
      color:var(--muted);
      max-width:900px;
    }

    .actions{
      display:flex;
      flex-wrap:wrap;
      gap:10px;
    }

    .btn{
      border:none;
      border-radius:14px;
      padding:11px 15px;
      cursor:pointer;
      transition: transform .16s ease, box-shadow .16s ease, background .16s ease;
      background:#fff;
      color:var(--text);
      border:1px solid var(--line);
      box-shadow: 0 8px 22px rgba(0,0,0,0.05);
    }

    .btn:hover{
      transform:translateY(-1px);
    }

    .btn.brand{
      background: linear-gradient(135deg, var(--brand), var(--brand-2));
      color:#fff;
      border-color: transparent;
    }

    .btn.dark{
      background:#1f2937;
      color:#fff;
      border-color:#1f2937;
    }

    .btn.warn{
      background:#fff7ed;
      color:#9a3412;
    }

    .btn.good{
      background:#f0fdf4;
      color:#166534;
    }

    .badge-row{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      margin-top:18px;
    }

    .badge{
      padding:9px 12px;
      border-radius:999px;
      border:1px solid var(--line);
      background:rgba(255,255,255,0.78);
      color:#7c2d12;
      font-size:.94rem;
      box-shadow: 0 6px 18px rgba(217,119,6,0.08);
    }

    .main{
      display:grid;
      grid-template-columns: 320px minmax(0,1fr);
      gap:18px;
      margin-top:18px;
    }

    .sidebar,
    .content-card{
      background:var(--panel);
      border:1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
    }

    .sidebar{
      padding:16px;
      position:sticky;
      top:18px;
      height:fit-content;
    }

    .side-title{
      margin:0 0 10px;
      font-size:1rem;
    }

    .side-list{
      display:grid;
      gap:10px;
      margin-top:12px;
    }

    .nav-btn{
      width:100%;
      text-align:left;
      padding:13px 14px;
      border-radius:16px;
      border:1px solid var(--line);
      background:#fff;
      cursor:pointer;
      display:flex;
      justify-content:space-between;
      align-items:center;
      transition:.16s ease;
    }

    .nav-btn.active{
      background:linear-gradient(135deg, #fff7ed, #fffbeb);
      border-color:#f59e0b;
      box-shadow: 0 8px 24px rgba(245,158,11,0.14);
    }

    .nav-btn small{
      color:var(--muted);
      display:block;
      margin-top:3px;
    }

    .right{
      display:grid;
      gap:18px;
    }

    .stats{
      display:grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap:14px;
    }

    .stat{
      background:var(--panel);
      border:1px solid var(--line);
      border-radius:20px;
      padding:16px;
      box-shadow: var(--shadow);
    }

    .stat h3{
      margin:0;
      font-size:.95rem;
      color:var(--muted);
      font-weight:600;
    }

    .stat .num{
      margin-top:8px;
      font-size:2rem;
      font-weight:800;
      color:#92400e;
    }

    .content-card{
      padding:18px;
    }

    .section-head{
      display:flex;
      justify-content:space-between;
      align-items:flex-start;
      gap:12px;
      flex-wrap:wrap;
      margin-bottom:14px;
    }

    .section-head h2{
      margin:0;
      font-size:1.2rem;
    }

    .section-head p{
      margin:5px 0 0;
      color:var(--muted);
    }

    .form-grid{
      display:grid;
      grid-template-columns: repeat(12, 1fr);
      gap:12px;
      margin-bottom:16px;
    }

    .field{
      grid-column: span 4;
      display:flex;
      flex-direction:column;
      gap:6px;
    }

    .field.wide{ grid-column: span 6; }
    .field.full{ grid-column: 1 / -1; }

    label{
      font-size:.92rem;
      color:#7c2d12;
      font-weight:600;
    }

    input, select, textarea{
      width:100%;
      border:1px solid var(--line);
      border-radius:14px;
      padding:12px 13px;
      background: rgba(255,255,255,0.92);
      color:var(--text);
      outline:none;
    }

    textarea{
      min-height:100px;
      resize:vertical;
    }

    input:focus, select:focus, textarea:focus{
      border-color: var(--brand-2);
      box-shadow: 0 0 0 4px rgba(245,158,11,0.14);
    }

    .toolbar{
      display:flex;
      flex-wrap:wrap;
      gap:10px;
      margin-top:8px;
    }

    .resource-grid{
      display:grid;
      grid-template-columns: repeat(2, minmax(0,1fr));
      gap:14px;
      margin-top:10px;
    }

    .resource-card{
      border:1px solid var(--line);
      background:var(--panel-strong);
      border-radius:18px;
      padding:14px;
      box-shadow: 0 10px 28px rgba(0,0,0,0.05);
    }

    .resource-card h3{
      margin:0 0 8px;
      font-size:1.05rem;
    }

    .pill-row{
      display:flex;
      flex-wrap:wrap;
      gap:8px;
      margin:8px 0 12px;
    }

    .pill{
      border-radius:999px;
      background:#fff7ed;
      color:#9a3412;
      border:1px solid #fed7aa;
      padding:6px 10px;
      font-size:.84rem;
    }

    .meta{
      color:var(--muted);
      font-size:.92rem;
      margin:6px 0;
    }

    .resource-actions{
      display:flex;
      gap:8px;
      flex-wrap:wrap;
      margin-top:12px;
    }

    .resource-actions .btn{
      padding:9px 12px;
      border-radius:12px;
      font-size:.92rem;
    }

    .two{
      display:grid;
      grid-template-columns: 1.1fr .9fr;
      gap:18px;
    }

    .terminal{
      background: var(--terminal);
      color: var(--terminal-text);
      border-radius: 18px;
      padding: 14px;
      min-height: 280px;
      border: 1px solid #374151;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.02);
      overflow:auto;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size:.92rem;
      line-height:1.5;
      white-space:pre-wrap;
    }

    .state-box{
      background: #fff;
      border:1px solid var(--line);
      border-radius:18px;
      padding:14px;
      min-height:280px;
      overflow:auto;
      font-family: ui-monospace, monospace;
      font-size:.9rem;
      white-space:pre-wrap;
    }

    .footer-note{
      margin-top:10px;
      color:var(--muted);
      font-size:.92rem;
    }

    .empty{
      padding:18px;
      border-radius:18px;
      border:1px dashed var(--line);
      background:#fffdf8;
      color:var(--muted);
      text-align:center;
    }

    .hidden{
      display:none !important;
    }

    @media (max-width: 1100px){
      .main{
        grid-template-columns: 1fr;
      }
      .sidebar{
        position:static;
      }
      .stats{
        grid-template-columns: repeat(2, minmax(0,1fr));
      }
      .resource-grid,
      .two{
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 720px){
      .stats{
        grid-template-columns: 1fr;
      }
      .field,
      .field.wide{
        grid-column: 1 / -1;
      }
      .hero{
        padding:18px;
      }
      .app{
        padding:14px;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <section class="hero">
      <div class="topbar">
        <div class="brand-wrap">
          <div class="logo">PP</div>
          <div>
            <h1>Programmer's Picnic — Dummy AWS Lab</h1>
            <p>
              Practice cloud concepts in a safe local simulation. Create fake EC2 instances, S3 buckets,
              Lambda functions, and API Gateway endpoints. Nothing here touches real AWS.
            </p>
          </div>
        </div
