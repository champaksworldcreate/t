<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Tabla Sargam Player | Programmer's Picnic</title>

  <style>
    :root{
      --bg:#fffaf0;
      --card:#ffffff;
      --brand:#d97706;
      --brand2:#f59e0b;
      --text:#2b2112;
    }

    body{
      margin:0;
      font-family: system-ui, sans-serif;
      background:var(--bg);
      color:var(--text);
      display:flex;
      justify-content:center;
      align-items:center;
      height:100vh;
    }

    .card{
      background:var(--card);
      padding:30px;
      border-radius:20px;
      box-shadow:0 20px 60px rgba(0,0,0,.1);
      max-width:500px;
      width:100%;
      text-align:center;
    }

    h1{
      margin-top:0;
      color:var(--brand);
    }

    input{
      width:100%;
      padding:12px;
      border-radius:10px;
      border:1px solid #ddd;
      margin:10px 0;
      font-size:16px;
    }

    button{
      background:linear-gradient(135deg,var(--brand),var(--brand2));
      border:none;
      color:white;
      padding:12px 20px;
      border-radius:10px;
      cursor:pointer;
      font-size:16px;
      margin-top:10px;
    }

    button:hover{
      opacity:.9;
    }

    .hint{
      font-size:14px;
      color:#666;
      margin-top:10px;
    }
  </style>
</head>

<body>

<div class="card">
  <h1>🥁 Tabla Sargam Player</h1>

  <input id="notes" placeholder="Type: sa re ga ma pa dha ni" />

  <button onclick="playNotes()">▶ Play</button>

  <div class="hint">
    Example: sa re ga ma pa dha ni sa
  </div>
</div>

<script>
const AudioContext = window.AudioContext || window.webkitAudioContext;
const ctx = new AudioContext();

// Frequencies for Sargam
const notesMap = {
  sa: 261.63,
  re: 293.66,
  ga: 329.63,
  ma: 349.23,
  pa: 392.00,
  dha: 440.00,
  ni: 493.88
};

// Tabla-like sound
function playTabla(freq, time){
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();

  osc.type = "sine";
  osc.frequency.setValueAtTime(freq, ctx.currentTime);

  // Percussion effect
  gain.gain.setValueAtTime(1, ctx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.3);

  osc.connect(gain);
  gain.connect(ctx.destination);

  osc.start(time);
  osc.stop(time + 0.3);
}

// Play sequence
function playNotes(){
  const input = document.getElementById("notes").value.toLowerCase();
  const sequence = input.split(" ");

  let time = ctx.currentTime;

  sequence.forEach((note, i) => {
    if(notesMap[note]){
      playTabla(notesMap[note], time + i * 0.4);
    }
  });
}
</script>

</body>
</html>
