<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Programmer's Picnic — Trading Dashboard</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

<style>

:root{
--bg:#fff7e6;
--panel:white;
--ink:#1f2328;
--saffron:#d97706;
--line:#eee;
--good:#0f9d58;
--bad:#d93025;
}

body{
margin:0;
font-family:Inter,system-ui;
background:var(--bg);
color:var(--ink);
}

.wrapper{
max-width:1100px;
margin:auto;
padding:20px;
}

header{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:20px;
}

h1{
margin:0;
font-size:22px;
}

.card{
background:var(--panel);
border-radius:14px;
padding:16px;
box-shadow:0 10px 30px rgba(0,0,0,.08);
margin-bottom:20px;
}

.summary{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:10px;
}

.metric{
padding:12px;
background:#fafafa;
border-radius:10px;
}

.metric b{
display:block;
font-size:18px;
}

table{
width:100%;
border-collapse:collapse;
}

th,td{
padding:10px;
border-bottom:1px solid var(--line);
font-size:14px;
}

th{
text-align:left;
color:#666;
}

.right{
text-align:right;
}

.good{color:var(--good)}
.bad{color:var(--bad)}

input{
width:80px;
padding:4px;
}

button{
background:var(--saffron);
color:white;
border:none;
padding:8px 12px;
border-radius:6px;
cursor:pointer;
}

textarea{
width:100%;
height:220px;
font-family:monospace;
}

</style>
</head>

<body>

<div class="wrapper">

<header>
<h1>📈 Trading Dashboard</h1>
<button onclick="reloadJSON()">Reload JSON</button>
</header>

<div class="card">
<div class="summary">

<div class="metric">
Invested
<b id="invested"></b>
</div>

<div class="metric">
Portfolio Value
<b id="value"></b>
</div>

<div class="metric">
Total Return
<b id="return"></b>
</div>

<div class="metric">
Return %
<b id="percent"></b>
</div>

</div>
</div>

<div class="card">

<h3>Holdings</h3>

<table>
<thead>
<tr>
<th>Stock</th>
<th>Shares</th>
<th>Buy Price</th>
<th>Current Price</th>
<th class="right">Value</th>
<th class="right">P/L</th>
<th>Signal</th>
</tr>
</thead>

<tbody id="table"></tbody>

</table>

</div>

<div class="card">

<h3>JSON Data</h3>
<p>You can edit prices here and press reload.</p>

<textarea id="json"></textarea>

</div>

</div>

<script>

const DATA = {

"portfolio":{

"stocks":[

{
"symbol":"SBI",
"name":"SBI",
"shares":6,
"buy_price":780,
"price":780
},

{
"symbol":"VI",
"name":"Vodafone Idea",
"shares":80,
"buy_price":12,
"price":12
},

{
"symbol":"NTPC",
"name":"NTPC",
"shares":2,
"buy_price":300,
"price":300
},

{
"symbol":"RELIANCE",
"name":"Reliance Industries",
"shares":2,
"buy_price":2800,
"price":2800
},

{
"symbol":"INDHOTEL",
"name":"Indian Hotels",
"shares":7,
"buy_price":600,
"price":600
},

{
"symbol":"TATAPOWER",
"name":"Tata Power",
"shares":2,
"buy_price":420,
"price":420
},

{
"symbol":"ETERNAL",
"name":"Eternal",
"shares":10,
"buy_price":270,
"price":270
},

{
"symbol":"EXIDE",
"name":"Exide Industries",
"shares":1,
"buy_price":580,
"price":580
},

{
"symbol":"JIOFIN",
"name":"Jio Financial",
"shares":8,
"buy_price":420,
"price":420
},

{
"symbol":"LEMONTREE",
"name":"Lemon Tree",
"shares":6,
"buy_price":160,
"price":160
}

]

}

}

function format(n){
return "₹"+n.toFixed(2)
}

function signal(buy,current){

let diff=((current-buy)/buy)*100

if(diff<=-5) return "<span class='good'>BUY DIP</span>"
if(diff>=5) return "<span class='bad'>SELL RISE</span>"

return "HOLD"

}

function render(data){

let table=""
let invested=0
let value=0

data.portfolio.stocks.forEach(s=>{

let cost=s.buy_price*s.shares
let val=s.price*s.shares
let pnl=val-cost

invested+=cost
value+=val

table+=`

<tr>

<td>${s.name}</td>
<td>${s.shares}</td>

<td>${format(s.buy_price)}</td>

<td>
<input type="number" value="${s.price}"
onchange="updatePrice('${s.symbol}',this.value)">
</td>

<td class="right">${format(val)}</td>

<td class="right ${pnl>=0?'good':'bad'}">${format(pnl)}</td>

<td>${signal(s.buy_price,s.price)}</td>

</tr>

`

})

document.getElementById("table").innerHTML=table

let ret=value-invested
let pct=(ret/invested)*100

document.getElementById("invested").innerText=format(invested)
document.getElementById("value").innerText=format(value)

document.getElementById("return").innerText=format(ret)
document.getElementById("percent").innerText=pct.toFixed(2)+"%"

}

function updatePrice(sym,val){

DATA.portfolio.stocks.forEach(s=>{
if(s.symbol===sym){
s.price=parseFloat(val)
}
})

render(DATA)

}

function reloadJSON(){

let j=document.getElementById("json").value

let obj=JSON.parse(j)

render(obj)

}

document.getElementById("json").value=JSON.stringify(DATA,null,2)

render(DATA)

</script>

</body>
</html>
