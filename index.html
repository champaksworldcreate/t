<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reel Maker V4 Ultra Fast</title>

<script src="js/gif.js"></script>

<style>
/* KEEPING ALL YOUR DESIGN — ONLY OPTIMIZED */

body{
  font-family: Arial;
  background:#eef4ff;
  margin:0;
  padding:20px;
}

/* ===== REEL SCREEN ===== */

.reel-screen{
  width:270px;
  height:480px;
  margin:auto;
  background:black;
  position:relative;
  overflow:hidden;
  border-radius:20px;
}

/* ===== MEDIA ===== */

.reel-screen img,
.reel-screen video{
  width:100%;
  height:100%;
  object-fit:cover;
  position:absolute;
}

/* ===== TEXT ===== */

.overlay{
  position:absolute;
  left:10px;
  right:10px;
  padding:10px;
  border-radius:12px;

  font-weight:bold;
  line-height:1.3;
  word-wrap:break-word;
  text-align:center;

  background:rgba(0,0,0,0.45);
  color:white;
}

/* ===== CONTROLS ===== */

button{
  padding:10px;
  margin:5px;
  border:none;
  border-radius:8px;
  background:#2563eb;
  color:white;
  font-weight:bold;
}

input,select{
  padding:8px;
  margin:5px;
}

/* ===== ANIMATION ===== */

.animated{
  animation-duration:1s;
}

@keyframes fadeIn{
  from{opacity:0;}
  to{opacity:1;}
}

@keyframes zoomIn{
  from{transform:scale(.6);opacity:0;}
  to{transform:scale(1);opacity:1;}
}

</style>
</head>

<body>

<h2>🎬 Reel Maker V4 Ultra Fast</h2>

<input type="file" id="mediaInput" multiple>
<br>

<input type="text" id="textInput" placeholder="Enter text">
<br>

<select id="anim">
<option value="fadeIn">Fade</option>
<option value="zoomIn">Zoom</option>
</select>

<br>

<button onclick="createSlides()">Create</button>
<button onclick="preview()">Preview</button>
<button onclick="exportFrames()">Export Frames</button>

<br><br>

<div id="screen" class="reel-screen"></div>

<script>

/* ===== STATE ===== */

let slides=[];
let index=0;

/* ===== CREATE SLIDES ===== */

function createSlides(){
  const files=document.getElementById('mediaInput').files;
  const text=document.getElementById('textInput').value;

  slides=[];

  for(let f of files){
    slides.push({
      file:f,
      url:URL.createObjectURL(f),
      text:text,
      duration:2000,
      anim:document.getElementById('anim').value
    });
  }

  index=0;
  render();
}

/* ===== RENDER ===== */

function render(){
  const s=slides[index];
  if(!s) return;

  const screen=document.getElementById('screen');
  screen.innerHTML='';
  screen.className="reel-screen animated";
  screen.style.animationName=s.anim;

  if(s.file.type.startsWith("image")){
    const img=document.createElement("img");
    img.src=s.url;
    screen.appendChild(img);
  }else{
    const v=document.createElement("video");
    v.src=s.url;
    v.autoplay=true;
    v.loop=true;
    screen.appendChild(v);
  }

  const overlay=document.createElement("div");
  overlay.className="overlay";

  /* TEXT OPTIMIZATION */
  overlay.style.fontSize="20px";
  overlay.style.bottom="20px";

  overlay.innerText=s.text;

  screen.appendChild(overlay);
}

/* ===== PREVIEW ===== */

function preview(){
  if(!slides.length) return;

  index=0;

  function loop(){
    render();
    index++;

    if(index>=slides.length) index=0;

    setTimeout(loop, slides[index]?.duration || 2000);
  }

  loop();
}

/* ===== EXPORT FRAMES ===== */

async function exportFrames(){

  if(!slides.length) return;

  const canvas=document.createElement("canvas");
  canvas.width=270;
  canvas.height=480;

  const ctx=canvas.getContext("2d");

  for(let i=0;i<slides.length;i++){

    const s=slides[i];

    await new Promise(res=>{
      const img=new Image();
      img.onload=function(){

        ctx.fillStyle="black";
        ctx.fillRect(0,0,270,480);

        ctx.drawImage(img,0,0,270,480);

        /* DRAW TEXT */
        ctx.fillStyle="white";
        ctx.font="bold 20px Arial";
        ctx.textAlign="center";

        wrapText(ctx,s.text,135,430,240,24);

        const link=document.createElement("a");
        link.download="frame_"+i+".png";
        link.href=canvas.toDataURL();
        link.click();

        res();
      };
      img.src=s.url;
    });

  }

}

/* ===== TEXT WRAP ===== */

function wrapText(ctx, text, x, y, maxWidth, lineHeight) {

  let words = text.split(' ');
  let line = '';
  let lines=[];

  for(let n=0;n<words.length;n++){
    let testLine = line + words[n] + ' ';
    let metrics = ctx.measureText(testLine);
    let testWidth = metrics.width;

    if(testWidth > maxWidth && n>0){
      lines.push(line);
      line = words[n] + ' ';
    }else{
      line = testLine;
    }
  }

  lines.push(line);

  for(let i=0;i<lines.length;i++){
    ctx.fillText(lines[i], x, y + (i*lineHeight));
  }
}

</script>

</body>
</html>
