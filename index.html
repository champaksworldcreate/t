<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Programmer’s Picnic — SQL Premium V2</title>

<meta name="description" content="Programmer’s Picnic SQL Premium Editor V2 with SQLite running in browser, schema explorer, history, saved queries, share links and theme toggle."/>
<meta name="theme-color" content="#1f6feb"/>

<style>

/* =========================
THEME VARIABLES
========================= */

:root{
--bg:#0d1117;
--panel:#161b22;
--panel2:#0f141b;
--line:#30363d;
--ink:#e6edf3;
--muted:#8b949e;
--accent:#1f6feb;
--chip:#21262d;
--field:#0b0f14;
--topbar:#010409;
--radius:14px;
}

html[data-theme="light"]{
--bg:#f6f8fb;
--panel:#ffffff;
--panel2:#eef2f7;
--line:#d0d7de;
--ink:#1f2328;
--muted:#57606a;
--accent:#d97706;
--chip:#f3f4f6;
--field:#ffffff;
--topbar:#fffdf8;
}

/* =========================
BASE
========================= */

*{box-sizing:border-box}

body{
margin:0;
background:var(--bg);
color:var(--ink);
font-family:system-ui,-apple-system,Segoe UI,Roboto;
}

/* =========================
TOPBAR
========================= */

.topbar{
display:flex;
gap:12px;
align-items:center;
padding:12px 16px;
border-bottom:1px solid var(--line);
background:var(--topbar);
position:sticky;
top:0;
z-index:10;
}

.brand-dot{
width:12px;
height:12px;
background:var(--accent);
border-radius:50%;
}

.title{
font-weight:700;
}

.grow{flex:1}

/* =========================
BUTTONS
========================= */

button{
border:1px solid var(--line);
background:var(--chip);
color:var(--ink);
padding:8px 12px;
border-radius:8px;
cursor:pointer;
}

button.primary{
background:var(--accent);
color:white;
border-color:var(--accent);
}

/* =========================
LAYOUT
========================= */

.layout{
display:grid;
grid-template-columns:280px 1fr 320px;
height:calc(100vh - 56px);
}

.sidebar{
background:var(--panel2);
border-right:1px solid var(--line);
padding:14px;
overflow:auto;
}

.rightbar{
background:var(--panel2);
border-left:1px solid var(--line);
padding:14px;
overflow:auto;
}

.main{
display:flex;
flex-direction:column;
}

/* =========================
EDITOR
========================= */

textarea{
width:100%;
height:180px;
background:var(--field);
color:var(--ink);
border:1px solid var(--line);
padding:10px;
border-radius:10px;
font-family:monospace;
}

/* =========================
RESULTS
========================= */

.results{
flex:1;
overflow:auto;
padding:10px;
}

table{
border-collapse:collapse;
width:100%;
}

td,th{
border:1px solid var(--line);
padding:6px 8px;
}

th{
background:var(--panel);
}

.small{
font-size:12px;
color:var(--muted);
}

</style>
</head>

<body>

<div class="topbar">

<div class="brand-dot"></div>

<div class="title">
Programmer’s Picnic — SQL Premium V2
</div>

<div class="grow"></div>

<button id="themeToggle">🌙 Dark</button>

</div>

<div class="layout">

<!-- SIDEBAR -->

<div class="sidebar">

<h4>Database</h4>

<button id="sampleDB">Load Sample DB</button>

<hr>

<h4>Quick Queries</h4>

<button class="chip" onclick="loadQuery('SELECT * FROM employees')">Employees</button>

<button class="chip" onclick="loadQuery('SELECT * FROM departments')">Departments</button>

<button class="chip" onclick="loadQuery('SELECT * FROM employees JOIN departments ON employees.department_id = departments.id')">Join</button>

<hr>

<h4>Saved Queries</h4>

<input id="saveName" placeholder="Query name"/>

<button onclick="saveQuery()">Save</button>

<div id="savedQueries"></div>

</div>


<!-- MAIN -->

<div class="main">

<div style="padding:10px">

<textarea id="editor">
SELECT * FROM employees;
</textarea>

<div style="margin-top:10px">

<button class="primary" onclick="runSQL()">Run SQL</button>

<button onclick="clearEditor()">Clear</button>

<button onclick="shareQuery()">Share</button>

</div>

</div>

<div class="results" id="results"></div>

</div>


<!-- RIGHTBAR -->

<div class="rightbar">

<h4>Query History</h4>

<div id="history"></div>

<hr>

<h4>Share Link</h4>

<input id="shareBox"/>

</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/sql.js@1.10.3/dist/sql-wasm.js"></script>

<script>

let SQL
let db

const editor = document.getElementById("editor")
const results = document.getElementById("results")
const historyDiv = document.getElementById("history")

/* =========================
INIT SQLITE
========================= */

initSqlJs({
locateFile:file=>'https://cdn.jsdelivr.net/npm/sql.js@1.10.3/dist/'+file
}).then(function(SQLLib){

SQL = SQLLib
loadSample()

})

/* =========================
LOAD SAMPLE DB
========================= */

function loadSample(){

db = new SQL.Database()

db.run(`
CREATE TABLE employees(
id INTEGER PRIMARY KEY,
name TEXT,
department_id INTEGER
);
`)

db.run(`
CREATE TABLE departments(
id INTEGER PRIMARY KEY,
department_name TEXT
);
`)

db.run(`
INSERT INTO departments VALUES
(1,'Engineering'),
(2,'HR'),
(3,'Finance');
`)

db.run(`
INSERT INTO employees VALUES
(1,'Aman',1),
(2,'Ritu',2),
(3,'Karan',1),
(4,'Sneha',3);
`)

}

/* =========================
RUN SQL
========================= */

function runSQL(){

let sql = editor.value

try{

let res = db.exec(sql)

renderResult(res)

addHistory(sql)

}catch(e){

results.innerHTML = "<pre>"+e+"</pre>"

}

}

/* =========================
RENDER TABLE
========================= */

function renderResult(res){

if(res.length==0){
results.innerHTML="<div class='small'>No result</div>"
return
}

let r = res[0]

let html = "<table><tr>"

r.columns.forEach(c=>{
html+="<th>"+c+"</th>"
})

html+="</tr>"

r.values.forEach(row=>{

html+="<tr>"

row.forEach(v=>{
html+="<td>"+v+"</td>"
})

html+="</tr>"

})

html+="</table>"

results.innerHTML = html

}

/* =========================
HISTORY
========================= */

function addHistory(sql){

let div = document.createElement("div")

div.className="small"

div.textContent=sql

historyDiv.prepend(div)

}

/* =========================
EDITOR UTIL
========================= */

function clearEditor(){
editor.value=""
}

function loadQuery(q){
editor.value=q
}

/* =========================
SAVE QUERIES
========================= */

function saveQuery(){

let name = document.getElementById("saveName").value

if(!name)return

let list = JSON.parse(localStorage.getItem("pp_sql_saved")||"[]")

list.push({
name:name,
sql:editor.value
})

localStorage.setItem("pp_sql_saved",JSON.stringify(list))

renderSaved()

}

function renderSaved(){

let list = JSON.parse(localStorage.getItem("pp_sql_saved")||"[]")

let container=document.getElementById("savedQueries")

container.innerHTML=""

list.forEach(q=>{

let b=document.createElement("button")

b.textContent=q.name

b.onclick=()=>editor.value=q.sql

container.appendChild(b)

})

}

renderSaved()

/* =========================
SHARE LINK
========================= */

function shareQuery(){

let q = encodeURIComponent(editor.value)

let url = location.origin + location.pathname + "?q="+q

document.getElementById("shareBox").value=url

}

const params = new URLSearchParams(location.search)

if(params.get("q")){
editor.value=decodeURIComponent(params.get("q"))
}

/* =========================
THEME TOGGLE
========================= */

const themeBtn = document.getElementById("themeToggle")

function applyTheme(mode){

document.documentElement.setAttribute("data-theme",mode)

localStorage.setItem("pp_sql_theme",mode)

themeBtn.textContent = mode==="light" ? "☀️ Light" : "🌙 Dark"

}

function toggleTheme(){

let mode = document.documentElement.getAttribute("data-theme")==="light"
? "dark"
: "light"

applyTheme(mode)

}

themeBtn.onclick = toggleTheme

applyTheme(localStorage.getItem("pp_sql_theme") || "dark")

</script>

</body>
</html>
