<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Student Activity Report</title>
  <meta name="description" content="Submit your student activity report with file attachment.">

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #eff6ff;
      color: #0f172a;
      text-align: center;
    }

    .box {
      max-width: 600px;
      margin: 80px auto;
      background: white;
      padding: 30px;
      border-radius: 18px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
    }

    h1 {
      color: #1d4ed8;
      margin-bottom: 10px;
    }

    p {
      font-size: 18px;
      color: #475569;
    }

    .btn {
      display: inline-block;
      margin-top: 20px;
      padding: 15px 26px;
      background: #2563eb;
      color: white;
      text-decoration: none;
      border-radius: 10px;
      font-size: 18px;
      font-weight: bold;
    }

    .note {
      margin-top: 20px;
      font-size: 14px;
      color: #64748b;
    }
  </style>
</head>

<body>

  <div class="box">
    <h1>Student Activity Report</h1>

    <p>
      Submit your daily work, problems, tomorrow’s plan,
      and attach files.
    </p>

    <a class="btn" href="https://forms.gle/RaM7MXMg3QNQBBKU6" target="_blank">
      Submit Activity Report
    </a>

    <div class="note">
      File upload is available inside the Google Form.
    </div>
  </div>

</body>
</html>
