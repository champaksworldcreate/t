<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Image Cursor Demo</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #fff8e7;
      color: #222;
      cursor: url("cursor.png") 16 16, auto;
    }

    .box {
      width: 300px;
      margin: 80px auto;
      padding: 24px;
      background: white;
      border: 2px solid #f0c36d;
      border-radius: 16px;
      text-align: center;
      box-shadow: 0 8px 24px rgba(0,0,0,0.08);
    }

    button {
      margin-top: 16px;
      padding: 10px 18px;
      border: none;
      border-radius: 10px;
      background: #d97706;
      color: white;
      font-size: 16px;
      cursor: url("cursor.png") 16 16, pointer;
    }
  </style>
</head>
<body>
  <div class="box">
    <h1>Image Cursor Example</h1>
    <p>Move your mouse on this page. The cursor will use the image file.</p>
    <button>Hover Me</button>
  </div>
</body>
</html>
