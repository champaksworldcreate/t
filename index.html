<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Sorting Algorithm Identifier V3 Premium</title>

<style>
:root{
  --bg:#fffaf0;
  --bg2:#fff4d6;
  --card:#ffffff;
  --text:#2b2112;
  --muted:#725b36;
  --brand:#f59e0b;
  --brand2:#d97706;
  --border:#f1d7a8;
  --good:#16a34a;
  --bad:#dc2626;
}
body{
  margin:0;
  font-family:Arial;
  background:linear-gradient(135deg,var(--bg),var(--bg2));
  color:var(--text);
}
.wrap{max-width:1100px;margin:auto;padding:20px;}
textarea{
  width:100%;
  min-height:200px;
  border-radius:14px;
  padding:14px;
  border:1px solid var(--border);
}
button{
  margin-top:10px;
  padding:10px 16px;
  border-radius:999px;
  border:0;
  background:linear-gradient(135deg,var(--brand),var(--brand2));
  color:#fff;
  font-weight:bold;
  cursor:pointer;
}
.card{
  margin-top:15px;
  padding:15px;
  background:#fff;
  border-radius:14px;
  border:1px solid var(--border);
}
.result{
  font-size:28px;
  font-weight:900;
  color:var(--brand2);
}
.barrow{
  display:flex;
  gap:6px;
}
.bar{
  min-width:40px;
  background:linear-gradient(#fbbf24,#d97706);
  color:#fff;
  display:flex;
  justify-content:center;
  align-items:flex-end;
  padding-bottom:6px;
  border-radius:8px;
}
.score{font-weight:bold;}
.good{color:green;}
.bad{color:red;}
</style>
</head>

<body>

<div class="wrap">

<h1>Sorting Algorithm Identifier</h1>

<textarea id="input">Start:  [5, 1, 4, 2, 8]
Pass 1: [1, 4, 2, 5, 8]
Pass 2: [1, 2, 4, 5, 8]
Pass 3: [1, 2, 4, 5, 8]</textarea>

<button onclick="identify()">Identify</button>
<button onclick="playAnimation()">Play</button>

<div class="card">
  <div class="result" id="result">Bubble Sort</div>
  <p id="reason"></p>
</div>

<div class="card" id="scores"></div>

<div class="card" id="viz"></div>

</div>

<script>

/* ----------- FIXED PARSER ----------- */
function parseInput(text){
  return text.split("\n")
    .map(line => line.match(/\[(.*?)\]/))
    .filter(Boolean)
    .map(m => m[1].split(",").map(x => Number(x.trim())));
}

function same(a,b){
  return a.length===b.length && a.every((v,i)=>v===b[i]);
}

/* ----------- SORTS ----------- */
function bubble(start){
  let a=[...start],s=[];
  for(let i=0;i<a.length-1;i++){
    for(let j=0;j<a.length-1-i;j++){
      if(a[j]>a[j+1]){
        [a[j],a[j+1]]=[a[j+1],a[j]];
      }
    }
    s.push([...a]);
  }
  return s;
}

function selection(start){
  let a=[...start],s=[];
  for(let i=0;i<a.length-1;i++){
    let m=i;
    for(let j=i+1;j<a.length;j++){
      if(a[j]<a[m]) m=j;
    }
    [a[i],a[m]]=[a[m],a[i]];
    s.push([...a]);
  }
  return s;
}

function insertion(start){
  let a=[...start],s=[];
  for(let i=1;i<a.length;i++){
    let key=a[i],j=i-1;
    while(j>=0 && a[j]>key){
      a[j+1]=a[j]; j--;
    }
    a[j+1]=key;
    s.push([...a]);
  }
  return s;
}

function counting(start){
  if(start.some(x=>x<0)) return [];
  let a=[...start],s=[];
  let max=Math.max(...a);
  let c=Array(max+1).fill(0);

  for(let x of a) c[x]++;
  let i=0;

  for(let v=0;v<c.length;v++){
    while(c[v]--){
      a[i++]=v;
      s.push([...a]);
    }
  }
  return s;
}

function radix(start){
  if(start.some(x=>x<0)) return [];
  let a=[...start],s=[];
  let max=Math.max(...a);

  for(let exp=1;Math.floor(max/exp)>0;exp*=10){
    let b=Array.from({length:10},()=>[]);
    for(let x of a){
      b[Math.floor(x/exp)%10].push(x);
    }
    a=[].concat(...b);
    s.push([...a]);
  }
  return s;
}

/* ----------- SCORE ----------- */
function score(expected, actual){
  let a=actual.slice(1);
  let p=0;
  for(let i=0;i<a.length;i++){
    if(expected[i] && same(expected[i],a[i])) p++;
  }
  return Math.round(p/a.length*100);
}

/* ----------- IDENTIFY ----------- */
function identify(){
  const steps=parseInput(document.getElementById("input").value);

  if(steps.length<2){
    document.getElementById("result").innerText="Not enough data";
    return;
  }

  const start=steps[0];

  const algos={
    "Bubble Sort":bubble(start),
    "Selection Sort":selection(start),
    "Insertion Sort":insertion(start),
    "Counting Sort":counting(start),
    "Radix Sort":radix(start)
  };

  const res=Object.entries(algos).map(([n,e])=>({
    name:n,
    score:score(e,steps)
  })).sort((a,b)=>b.score-a.score);

  const best=res[0];

  document.getElementById("result").innerText=best.name;

  document.getElementById("reason").innerText={
    "Bubble Sort":"Largest element moves right each pass",
    "Selection Sort":"Minimum selected each pass",
    "Insertion Sort":"Sorted part grows from left",
    "Counting Sort":"Frequency reconstruction",
    "Radix Sort":"Digit-wise sorting"
  }[best.name];

  document.getElementById("scores").innerHTML=
    res.map(r=>`${r.name}: <span class="${r.score>70?'good':'bad'}">${r.score}%</span>`).join("<br>");

  visualize(steps);
}

/* ----------- VISUAL ----------- */
function visualize(steps){
  let max=Math.max(...steps.flat());

  document.getElementById("viz").innerHTML=
    steps.map((a,i)=>`
      <h3>${i===0?"Start":"Pass "+i}</h3>
      <div class="barrow">
        ${a.map(x=>`
          <div class="bar" style="height:${40+(x/max)*120}px">${x}</div>
        `).join("")}
      </div>
    `).join("");
}

/* ----------- ANIMATION ----------- */
function playAnimation(){
  const steps=parseInput(document.getElementById("input").value);
  let i=0;
  const t=setInterval(()=>{
    visualize([steps[i]]);
    i++;
    if(i>=steps.length) clearInterval(t);
  },800);
}

identify();
</script>

</body>
</html>
