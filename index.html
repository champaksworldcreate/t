<!DOCTYPE html>
<html>
<head>
  <title>N x N Grid</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f2fbfa;
      text-align: center;
      padding: 30px;
    }

    h1 {
      color: #064e4a;
    }

    input, button {
      padding: 10px;
      font-size: 16px;
      margin: 5px;
      border-radius: 8px;
      border: 1px solid #0f766e;
    }

    button {
      background: #0f766e;
      color: white;
      cursor: pointer;
    }

    #grid {
      margin: 25px auto;
      display: grid;
      gap: 5px;
      justify-content: center;
    }

    .cell {
      width: 50px;
      height: 50px;
      background: white;
      border: 2px solid #0f766e;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      border-radius: 8px;
    }
  </style>
</head>
<body>

  <h1>N x N Grid Generator</h1>

  <input type="number" id="nValue" placeholder="Enter N" min="1" value="5">
  <button onclick="makeGrid()">Make Grid</button>

  <div id="grid"></div>

  <script>
    function makeGrid() {
      let n = Number(document.getElementById("nValue").value);
      let grid = document.getElementById("grid");

      grid.innerHTML = "";

      grid.style.gridTemplateColumns = `repeat(${n}, 50px)`;

      for (let i = 1; i <= n * n; i++) {
        let cell = document.createElement("div");
        cell.className = "cell";
        cell.textContent = i;
        grid.appendChild(cell);
      }
    }

    makeGrid();
  </script>

</body>
</html>
