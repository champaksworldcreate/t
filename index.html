<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Dynamic Datalist: State → City → Locality</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="wrap">
    <header class="hero">
      <h1>Dynamic Datalist</h1>
      <p>State → City → Locality (with validation + smart UX)</p>
    </header>

    <section class="card">
      <div class="row">
        <label for="stateInput">State</label>
        <input id="stateInput" list="statesList" placeholder="Type or pick a state" autocomplete="off" />
        <datalist id="statesList"></datalist>
        <small id="stateHint" class="hint"></small>
      </div>

      <div class="row">
        <label for="cityInput">City</label>
        <input id="cityInput" list="citiesList" placeholder="Pick state first" autocomplete="off" disabled />
        <datalist id="citiesList"></datalist>
        <small id="cityHint" class="hint"></small>
      </div>

      <div class="row">
        <label for="localityInput">Locality</label>
        <input id="localityInput" list="localitiesList" placeholder="Pick city first" autocomplete="off" disabled />
        <datalist id="localitiesList"></datalist>
        <small id="localityHint" class="hint"></small>
      </div>

      <div class="controls">
        <label class="chk">
          <input type="checkbox" id="allowCustom" />
          Allow custom values (disable strict validation)
        </label>

        <button id="resetBtn" type="button">Reset</button>
        <button id="submitBtn" type="button">Submit</button>
      </div>

      <div id="status" class="status" aria-live="polite"></div>
      <pre id="output" class="output" hidden></pre>
    </section>

    <footer class="foot">
      <span>Programmer’s Picnic • Light Saffron UI</span>
    </footer>
  </main>

  <script src="app.js"></script>
</body>
</html>
