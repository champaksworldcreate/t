<!DOCTYPE html>
<html>
<head>
<title>Basic Grid Highlighter</title>

<style>
body{
    font-family: Arial, sans-serif;
    background:#eef8f8;
    text-align:center;
}

input, button{
    font-size:18px;
    padding:8px;
    margin:6px;
}

#expression{
    width:90%;
    max-width:600px;
}

#gridBox{
    width:95vw;
    max-height:70vh;
    overflow:auto;
    border:3px solid #00897b;
    margin:auto;
    padding:10px;
    background:white;
}

#grid{
    display:grid;
    gap:6px;
}

.cell{
    width:90px;
    height:70px;
    border:2px solid #00897b;
    border-radius:8px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:bold;
    color:#00695c;
}

.highlight{
    background:gold;
    color:black;
    border-color:red;
}

#error{
    color:red;
    font-weight:bold;
    min-height:25px;
}
</style>
</head>

<body>

<h1>M × N Grid Highlighter</h1>

Rows:
<input type="number" id="rows" value="7" min="1">

Columns:
<input type="number" id="cols" value="7" min="1">

<button onclick="makeGrid()">Generate Grid</button>

<br><br>

Expression:
<br>
<input
    id="expression"
    value="(col = 1) and (row <= m)"
    oninput="highlightGrid()">

<div id="error"></div>

<div id="gridBox">
    <div id="grid"></div>
</div>

<script>
let m = 7; // total rows
let n = 7; // total columns

function makeGrid(){
    m = Number(document.getElementById("rows").value);
    n = Number(document.getElementById("cols").value);

    let grid = document.getElementById("grid");
    grid.innerHTML = "";

    grid.style.gridTemplateColumns = `repeat(${n}, 90px)`;

    for(let row = 1; row <= m; row++){
        for(let col = 1; col <= n; col++){
            let cell = document.createElement("div");

            cell.className = "cell";
            cell.dataset.row = row;
            cell.dataset.col = col;
            cell.innerText = `(${row}, ${col})`;

            grid.appendChild(cell);
        }
    }

    highlightGrid();
}

function convertToJavaScript(expression){
    expression = expression.toLowerCase();

    expression = expression.replaceAll(" and ", " && ");
    expression = expression.replaceAll(" or ", " || ");
    expression = expression.replaceAll("not ", "! ");

    // Convert single = into ==
    // Does not disturb <=, >=, !=, ==
    expression = expression.replace(/(?<![<>=!])=(?![=])/g, "==");

    return expression;
}

function checkCell(expression, row, col){
    let jsExpression = convertToJavaScript(expression);

    return Function(
        "row",
        "col",
        "m",
        "n",
        "return " + jsExpression;
    )(row, col, m, n);
}

function highlightGrid(){
    let expression = document.getElementById("expression").value;
    let errorBox = document.getElementById("error");
    let cells = document.querySelectorAll(".cell");

    errorBox.innerText = "";

    for(let cell of cells){
        let row = Number(cell.dataset.row);
        let col = Number(cell.dataset.col);

        try{
            if(checkCell(expression, row, col)){
                cell.classList.add("highlight");
            }else{
                cell.classList.remove("highlight");
            }
        }
        catch(error){
            cell.classList.remove("highlight");
            errorBox.innerText = "Invalid expression";
        }
    }
}

makeGrid();
</script>

</body>
</html>
