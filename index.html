<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>WebSocket Test on GitHub Pages</title>

  <style>
    :root {
      --bg: #fff7ed;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --saffron: #f59e0b;
      --saffron-dark: #d97706;
      --green: #16a34a;
      --red: #dc2626;
      --line: #fed7aa;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at top left, #ffedd5, transparent 35%),
        linear-gradient(135deg, #fff7ed, #fffbeb);
      color: var(--text);
      padding: 24px;
    }

    .wrap {
      max-width: 900px;
      margin: auto;
    }

    .hero {
      background: linear-gradient(135deg, #f59e0b, #fb923c);
      color: white;
      border-radius: 28px;
      padding: 28px;
      box-shadow: 0 18px 45px rgba(217, 119, 6, 0.25);
      margin-bottom: 20px;
    }

    .hero h1 {
      margin: 0 0 8px;
      font-size: clamp(28px, 5vw, 46px);
    }

    .hero p {
      margin: 0;
      font-size: 18px;
      opacity: 0.95;
    }

    .card {
      background: rgba(255, 255, 255, 0.9);
      border: 1px solid var(--line);
      border-radius: 24px;
      padding: 22px;
      box-shadow: 0 12px 32px rgba(120, 53, 15, 0.08);
      margin-bottom: 18px;
    }

    label {
      display: block;
      font-weight: 700;
      margin-bottom: 8px;
    }

    input,
    textarea {
      width: 100%;
      border: 1px solid #fdba74;
      border-radius: 16px;
      padding: 14px;
      font: inherit;
      outline: none;
      background: white;
    }

    textarea {
      min-height: 90px;
      resize: vertical;
    }

    input:focus,
    textarea:focus {
      border-color: var(--saffron-dark);
      box-shadow: 0 0 0 4px rgba(245, 158, 11, 0.18);
    }

    .row {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 14px;
    }

    button {
      border: 0;
      border-radius: 999px;
      padding: 12px 18px;
      font-weight: 800;
      cursor: pointer;
      background: var(--saffron);
      color: white;
      box-shadow: 0 8px 18px rgba(217, 119, 6, 0.22);
    }

    button:hover {
      background: var(--saffron-dark);
    }

    button.secondary {
      background: #fff7ed;
      color: var(--saffron-dark);
      border: 1px solid #fdba74;
    }

    button.danger {
      background: var(--red);
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 14px;
      border-radius: 999px;
      font-weight: 800;
      background: #f3f4f6;
      color: var(--muted);
      margin-top: 10px;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--muted);
    }

    .status.open {
      background: #dcfce7;
      color: var(--green);
    }

    .status.open .dot {
      background: var(--green);
    }

    .status.closed {
      background: #fee2e2;
      color: var(--red);
    }

    .status.closed .dot {
      background: var(--red);
    }

    pre {
      background: #111827;
      color: #f9fafb;
      border-radius: 18px;
      padding: 16px;
      min-height: 220px;
      overflow: auto;
      white-space: pre-wrap;
      line-height: 1.5;
    }

    .small {
      color: var(--muted);
      font-size: 14px;
    }
  </style>
</head>

<body>
  <main class="wrap">
    <section class="hero">
      <h1>WebSocket Test</h1>
      <p>Test WebSocket connections directly from a GitHub Pages static page.</p>
    </section>

    <section class="card">
      <label for="url">WebSocket URL</label>
      <input
        id="url"
        value="wss://ws.postman-echo.com/raw"
        placeholder="wss://example.com/socket"
      />

      <div id="status" class="status closed">
        <span class="dot"></span>
        <span>Disconnected</span>
      </div>

      <div class="row">
        <button onclick="connectWS()">Connect</button>
        <button class="danger" onclick="disconnectWS()">Disconnect</button>
        <button class="secondary" onclick="clearLog()">Clear Log</button>
      </div>

      <p class="small">
        On GitHub Pages, prefer wss:// URLs. ws:// may be blocked because the page is HTTPS.
      </p>
    </section>

    <section class="card">
      <label for="msg">Message to send</label>
      <textarea id="msg">Hello from GitHub Pages</textarea>

      <div class="row">
        <button onclick="sendMessage()">Send Message</button>
        <button class="secondary" onclick="sendChampak()">Send Test: Champak</button>
      </div>
    </section>

    <section class="card">
      <label>Log</label>
      <pre id="log"></pre>
    </section>
  </main>

  <script>
    let socket = null;

    const logBox = document.getElementById("log");
    const statusBox = document.getElementById("status");

    function log(message) {
      const time = new Date().toLocaleTimeString();
      logBox.textContent += `[${time}] ${message}\n`;
      logBox.scrollTop = logBox.scrollHeight;
    }

    function setStatus(text, isOpen) {
      statusBox.className = "status " + (isOpen ? "open" : "closed");
      statusBox.querySelector("span:last-child").textContent = text;
    }

    function connectWS() {
      const url = document.getElementById("url").value.trim();

      if (!url) {
        log("Please enter a WebSocket URL.");
        return;
      }

      if (socket && socket.readyState === WebSocket.OPEN) {
        log("Already connected.");
        return;
      }

      try {
        socket = new WebSocket(url);

        log("Connecting to " + url);

        socket.onopen = function () {
          setStatus("Connected", true);
          log("Connection opened.");
        };

        socket.onmessage = function (event) {
          log("Received: " + event.data);
        };

        socket.onerror = function () {
          log("WebSocket error. Check URL, server, SSL, and CORS/origin rules.");
        };

        socket.onclose = function (event) {
          setStatus("Disconnected", false);
          log("Connection closed. Code: " + event.code + ", Reason: " + (event.reason || "none"));
        };
      } catch (err) {
        log("Failed to create WebSocket: " + err.message);
      }
    }

    function disconnectWS() {
      if (!socket) {
        log("No socket to disconnect.");
        return;
      }

      socket.close();
      socket = null;
      setStatus("Disconnected", false);
      log("Disconnect requested.");
    }

    function sendMessage() {
      const message = document.getElementById("msg").value;

      if (!socket || socket.readyState !== WebSocket.OPEN) {
        log("Not connected. Click Connect first.");
        return;
      }

      socket.send(message);
      log("Sent: " + message);
    }

    function sendChampak() {
      document.getElementById("msg").value = "Champak";
      sendMessage();
    }

    function clearLog() {
      logBox.textContent = "";
    }
  </script>
</body>
</html>
