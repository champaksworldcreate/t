<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>M × N Grid Generator</title>

<style>
body{
    font-family: Arial, Helvetica, sans-serif;
    background: #eef8f8;
    text-align: center;
    margin: 20px;
}

h1{
    color: #00695c;
}

.controls{
    margin: 20px;
}

input{
    width: 80px;
    padding: 8px;
    font-size: 16px;
    text-align: center;
}

button{
    padding: 8px 20px;
    font-size: 16px;
    cursor: pointer;
    background: #00897b;
    color: white;
    border: none;
    border-radius: 6px;
}

#grid{
    margin: 20px auto;
    display: grid;
    gap: 5px;
    justify-content: center;
}

.cell{
    width: 90px;
    height: 70px;
    border: 2px solid #00897b;
    background: white;
    border-radius: 8px;
    display: flex;
    justify-content: center;
    align-items: center;
}

.coord{
    font-size: 18px;
    font-weight: bold;
    color: #00695c;
}
</style>
</head>
<body>

<h1>M × N Grid Generator</h1>

<div class="controls">
    Rows (M):
    <input type="number" id="rows" value="4" min="1">

    Columns (N):
    <input type="number" id="cols" value="5" min="1">

    <button onclick="makeGrid()">Generate</button>
</div>

<div id="grid"></div>

<script>
function makeGrid(){

    let rows = parseInt(document.getElementById("rows").value);
    let cols = parseInt(document.getElementById("cols").value);

    let grid = document.getElementById("grid");

    grid.innerHTML = "";

    grid.style.gridTemplateColumns = `repeat(${cols}, 90px)`;

    for(let m = 1; m <= rows; m++){

        for(let n = 1; n <= cols; n++){

            let cell = document.createElement("div");
            cell.className = "cell";

            cell.innerHTML = `
                <div class="coord">(${m}, ${n})</div>
            `;

            grid.appendChild(cell);
        }
    }
}

makeGrid();
</script>

</body>
</html>
