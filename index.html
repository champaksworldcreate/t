<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Saturday Questions — Programmer’s Picnic</title>

<style>
:root{
  --bg:#fff7e6;
  --panel:#ffffff;
  --ink:#1f2328;
  --muted:#59636e;
  --saffron:#ff9f1c;
  --line:rgba(31,35,40,.12);
  --radius:18px;
  --shadow:0 10px 30px rgba(31,35,40,.10);
  --sans:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial;
  --mono:ui-monospace,Consolas,monospace;
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:var(--sans);
  background:radial-gradient(1000px 600px at 10% 0%,rgba(255,159,28,.2),transparent 60%),var(--bg);
  color:var(--ink);
}
.topbar{
  display:flex;justify-content:space-between;align-items:center;
  padding:14px 20px;background:rgba(255,255,255,.85);
  border-bottom:1px solid var(--line);
}
.brand{display:flex;align-items:center;gap:12px}
.logo{
  width:44px;height:44px;border-radius:12px;
  background:linear-gradient(145deg,var(--saffron),#ffb74d);
  display:grid;place-items:center;font-weight:900;
}
.title{font-weight:900;font-size:18px}
.subtitle{font-size:12px;color:var(--muted)}
.btn{
  background:rgba(255,159,28,.2);
  border:1px solid rgba(255,159,28,.4);
  padding:8px 14px;border-radius:14px;cursor:pointer;
}
.layout{
  display:grid;grid-template-columns:320px 1fr;
  gap:16px;padding:16px;max-width:1400px;margin:auto;
}
.panel{
  background:rgba(255,255,255,.9);
  border:1px solid var(--line);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
}
.panel-head{padding:12px 16px;font-weight:700;border-bottom:1px solid var(--line)}
.q-list{padding:12px}
.q-item{
  padding:10px;border:1px solid var(--line);
  border-radius:14px;margin-bottom:10px;cursor:pointer;
}
.q-item:hover{border-color:var(--saffron)}
.content{padding:16px;font-size:14px;line-height:1.6}
img{max-width:100%;border-radius:12px;margin-bottom:15px}
iframe{width:100%;height:520px;border:none}
@media(max-width:900px){
  .layout{grid-template-columns:1fr}
  iframe{height:420px}
}
</style>
</head>

<body>

<header class="topbar">
  <div class="brand">
    <div class="logo">PP</div>
    <div>
      <div class="title">Saturday Spiral Challenge</div>
      <div class="subtitle">Direct & Reverse Spiral Pattern</div>
    </div>
  </div>
  <button class="btn" onclick="copyLink()">Share</button>
</header>

<main class="layout">

  <!-- Question List -->
  <aside class="panel">
    <div class="panel-head">Questions</div>
    <div id="qList" class="q-list"></div>
  </aside>

  <!-- Question + Editor -->
  <section class="panel">
    <div class="panel-head" id="qTitle">Select a Question</div>
    <div id="qPrompt" class="content">Choose a question from the left.</div>

    <!-- Spiral Image -->
    <div class="content">
      <img src="spiral.jpg" alt="Spiral Pattern">
    </div>

    <!-- Your Existing Editor -->
    <iframe
      src="https://programmer-s-picnic.github.io/lesson-viewer/python-starter/editor/super/?tmode=1">
    </iframe>

  </section>

</main>

<script>

const QUESTIONS = [

{
  id:"Q1-direct-spiral",
  title:"Print 4x4 Spiral (Direct)",
  prompt:`
Print the following spiral pattern:

1   2   3   4
12 13  14   5
11 16  15   6
10  9   8   7

Rules:
- Use loops
- Do NOT hardcode
- Generate logically
`
},

{
  id:"Q2-reverse-spiral",
  title:"Print 4x4 Spiral (Reverse)",
  prompt:`
Print the reverse spiral pattern:

1  12 11 10
2  13 16  9
3  14 15  8
4   5  6  7

Rules:
- Use loops
- Do NOT hardcode
- Generate logically
`
}

];

const qList = document.getElementById("qList");
const qTitle = document.getElementById("qTitle");
const qPrompt = document.getElementById("qPrompt");

function renderList(){
  qList.innerHTML = QUESTIONS.map(q=>`
    <div class="q-item" onclick="selectQ('${q.id}')">
      <b>${q.title}</b>
    </div>
  `).join("");
}

function selectQ(id){
  const q = QUESTIONS.find(x=>x.id===id);
  if(!q) return;
  qTitle.textContent = q.title;
  qPrompt.innerHTML = q.prompt.replace(/\n/g,"<br>");
  const url = new URL(window.location);
  url.searchParams.set("q",id);
  history.replaceState({},'',url);
}

function copyLink(){
  navigator.clipboard.writeText(window.location.href);
  alert("Link copied!");
}

renderList();

</script>

</body>
</html>
