<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reel Maker V4 Ultra+ Text Animation</title>

<script src="js/gif.js"></script>

<style>
body{
  font-family: Arial;
  background:#eef4ff;
  text-align:center;
  padding:20px;
}

.reel-screen{
  width:270px;
  height:480px;
  margin:auto;
  background:black;
  position:relative;
  overflow:hidden;
  border-radius:20px;
}

/* ===== MEDIA ===== */
.reel-screen img,
.reel-screen video{
  width:100%;
  height:100%;
  object-fit:cover;
  position:absolute;
}

/* ===== TEXT ===== */
.overlay{
  position:absolute;
  left:10px;
  right:10px;
  padding:10px;
  border-radius:12px;
  font-weight:bold;
  line-height:1.3;
  text-align:center;
  color:white;
  background:rgba(0,0,0,0.4);
}

/* ===== TEXT ANIMATIONS ===== */

.fade { animation: fadeIn 1s ease; }

.slideUp { animation: slideUp 1s ease; }

.slideLeft { animation: slideLeft 1s ease; }

.slideRight { animation: slideRight 1s ease; }

.zoom { animation: zoom 1s ease; }

.bounce { animation: bounce 1s ease; }

.float { animation: float 3s infinite ease-in-out; }

.typewriter{
  overflow:hidden;
  border-right:2px solid white;
  white-space:nowrap;
  animation: typing 2s steps(30,end), blink .5s step-end infinite alternate;
}

/* KEYFRAMES */

@keyframes fadeIn{
  from{opacity:0;} to{opacity:1;}
}

@keyframes slideUp{
  from{transform:translateY(100px); opacity:0;}
  to{transform:translateY(0); opacity:1;}
}

@keyframes slideLeft{
  from{transform:translateX(100px); opacity:0;}
  to{transform:translateX(0); opacity:1;}
}

@keyframes slideRight{
  from{transform:translateX(-100px); opacity:0;}
  to{transform:translateX(0); opacity:1;}
}

@keyframes zoom{
  from{transform:scale(.5); opacity:0;}
  to{transform:scale(1); opacity:1;}
}

@keyframes bounce{
  0%{transform:scale(.5);}
  50%{transform:scale(1.2);}
  100%{transform:scale(1);}
}

@keyframes float{
  0%{transform:translateY(0);}
  50%{transform:translateY(-10px);}
  100%{transform:translateY(0);}
}

@keyframes typing{
  from{width:0}
  to{width:100%}
}

@keyframes blink{
  50%{border-color:transparent}
}

/* ===== CONTROLS ===== */

button{
  padding:10px;
  margin:5px;
  border:none;
  border-radius:8px;
  background:#2563eb;
  color:white;
  font-weight:bold;
}

input,select{
  padding:8px;
  margin:5px;
}

</style>
</head>

<body>

<h2>🎬 Reel Maker V4 Ultra+ Text Animation</h2>

<input type="file" id="mediaInput" multiple>
<br>

<input type="text" id="textInput" placeholder="Enter text">
<br>

<select id="anim">
<option value="fade">Fade</option>
<option value="slideUp">Slide Up</option>
<option value="slideLeft">Slide Left</option>
<option value="slideRight">Slide Right</option>
<option value="zoom">Zoom</option>
<option value="bounce">Bounce</option>
<option value="float">Float</option>
<option value="typewriter">Typewriter</option>
</select>

<br>

<select id="mode">
<option value="media">Media + Text</option>
<option value="textOnly">Text Only Reel</option>
</select>

<br>

<button onclick="createSlides()">Create</button>
<button onclick="preview()">Preview</button>
<button onclick="exportFrames()">Export Frames</button>

<br><br>

<div id="screen" class="reel-screen"></div>

<script>

let slides=[];
let index=0;

/* CREATE */

function createSlides(){
  const files=document.getElementById('mediaInput').files;
  const text=document.getElementById('textInput').value;
  const anim=document.getElementById('anim').value;
  const mode=document.getElementById('mode').value;

  slides=[];

  if(mode==="textOnly"){
    slides.push({
      text:text,
      duration:2000,
      anim:anim,
      type:"text"
    });
  }else{
    for(let f of files){
      slides.push({
        file:f,
        url:URL.createObjectURL(f),
        text:text,
        duration:2000,
        anim:anim,
        type:"media"
      });
    }
  }

  index=0;
  render();
}

/* RENDER */

function render(){
  const s=slides[index];
  if(!s) return;

  const screen=document.getElementById('screen');
  screen.innerHTML='';

  /* BACKGROUND */
  if(s.type==="media"){
    if(s.file.type.startsWith("image")){
      const img=document.createElement("img");
      img.src=s.url;
      screen.appendChild(img);
    }else{
      const v=document.createElement("video");
      v.src=s.url;
      v.autoplay=true;
      v.loop=true;
      screen.appendChild(v);
    }
  }else{
    screen.style.background="linear-gradient(135deg,#1e3a8a,#2563eb)";
  }

  /* TEXT */
  const overlay=document.createElement("div");
  overlay.className="overlay "+s.anim;
  overlay.innerText=s.text;

  /* RANDOM MOVEMENT */
  overlay.style.top = Math.random()*300 + "px";
  overlay.style.left = Math.random()*50 + "px";

  screen.appendChild(overlay);
}

/* PREVIEW */

function preview(){
  if(!slides.length) return;

  index=0;

  function loop(){
    render();
    index++;
    if(index>=slides.length) index=0;
    setTimeout(loop, slides[index]?.duration || 2000);
  }

  loop();
}

/* EXPORT */

async function exportFrames(){

  const canvas=document.createElement("canvas");
  canvas.width=270;
  canvas.height=480;
  const ctx=canvas.getContext("2d");

  for(let i=0;i<slides.length;i++){

    const s=slides[i];

    ctx.fillStyle="black";
    ctx.fillRect(0,0,270,480);

    if(s.type==="media"){
      await new Promise(res=>{
        const img=new Image();
        img.onload=function(){
          ctx.drawImage(img,0,0,270,480);
          res();
        };
        img.src=s.url;
      });
    }

    /* TEXT */
    ctx.fillStyle="white";
    ctx.font="bold 22px Arial";
    ctx.textAlign="center";

    ctx.fillText(s.text,135,240);

    const link=document.createElement("a");
    link.download="frame_"+i+".png";
    link.href=canvas.toDataURL();
    link.click();
  }
}

</script>

</body>
</html>
