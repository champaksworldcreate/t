<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#d97706" />
  <title>PP — HTML/CSS/JS Runner (Mini Playground)</title>
  <style>
    :root{
      --bg0:#fff7e6; --bg1:#fff1d6;
      --card:rgba(255,255,255,.92);
      --ink:#1f2937; --muted:#6b7280;
      --brand:#d97706; --brand2:#f59e0b;
      --border:rgba(31,41,55,.12);
      --shadow:0 14px 40px rgba(17,24,39,.10);
      --ring:0 0 0 4px rgba(217,119,6,.18);
      --r2:22px;
      --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono","Courier New", monospace;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;
      color:var(--ink);
      background:
        radial-gradient(1100px 520px at 12% 0%, rgba(245,158,11,.22), transparent 60%),
        radial-gradient(900px 420px at 92% 18%, rgba(217,119,6,.18), transparent 55%),
        linear-gradient(180deg,var(--bg0),var(--bg1));
    }
    .wrap{max-width:1280px;margin:0 auto;padding:14px 14px 44px}
    .top{
      border:1px solid var(--border);
      border-radius:var(--r2);
      background:rgba(255,255,255,.78);
      box-shadow:var(--shadow);
      padding:14px;
      display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between;
    }
    h1{margin:0;font-size:20px;letter-spacing:-.2px}
    .sub{margin:4px 0 0;color:var(--muted);font-weight:650}
    .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
    .pill{
      display:inline-flex;align-items:center;gap:8px;
      padding:6px 10px;border-radius:999px;
      border:1px solid rgba(217,119,6,.25);
      background:rgba(255,255,255,.7);
      font-weight:900;color:#92400e;
    }
    .btn{
      border:1px solid var(--border);
      background:white;
      padding:10px 12px;
      border-radius:14px;
      cursor:pointer;
      font-weight:900;
      box-shadow:0 6px 18px rgba(17,24,39,.06);
    }
    .btn.primary{
      border-color:rgba(217,119,6,.35);
      background:linear-gradient(135deg, rgba(217,119,6,.12), rgba(245,158,11,.16));
    }
    .btn:focus-visible{outline:none;box-shadow:var(--shadow),var(--ring)}
    .chk{transform:scale(1.1)}
    .layout{
      display:grid;
      grid-template-columns:1.15fr .85fr;
      gap:12px;
      margin-top:12px;
    }
    @media(max-width:1100px){.layout{grid-template-columns:1fr}}
    .card{
      border:1px solid var(--border);
      border-radius:var(--r2);
      background:var(--card);
      box-shadow:var(--shadow);
      overflow:hidden;
    }
    .hd{
      padding:10px 12px;
      border-bottom:1px solid rgba(31,41,55,.10);
      background:
        radial-gradient(900px 360px at 10% 0%, rgba(245,158,11,.18), transparent 55%),
        radial-gradient(800px 320px at 92% 10%, rgba(217,119,6,.14), transparent 55%);
      display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between;
    }
    .tabs{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
    .tab{
      border:1px solid rgba(31,41,55,.12);
      background:rgba(255,255,255,.75);
      border-radius:999px;
      padding:7px 10px;
      font-weight:950;
      cursor:pointer;
    }
    .tab.active{
      border-color:rgba(217,119,6,.35);
      background:rgba(245,158,11,.14);
      color:#92400e;
    }
    textarea{
      width:100%;
      min-height:520px;
      resize:vertical;
      border:0;
      outline:none;
      padding:12px;
      font-family:var(--mono);
      font-size:13px;
      line-height:1.45;
      background:rgba(255,255,255,.78);
    }
    .pane{display:none}
    .pane.active{display:block}
    .previewBox{padding:0}
    iframe{
      width:100%;
      height:520px;
      border:0;
      background:white;
    }
    .console{
      border-top:1px solid rgba(31,41,55,.10);
      padding:10px 12px;
      background:rgba(255,255,255,.78);
      font-family:var(--mono);
      font-size:12px;
      min-height:140px;
      max-height:220px;
      overflow:auto;
      white-space:pre-wrap;
    }
    .line{padding:3px 0;border-bottom:1px dashed rgba(31,41,55,.10)}
    .line:last-child{border-bottom:0}
    .muted{color:var(--muted)}
    .err{color:#9a3412;font-weight:800}
    .warn{color:#92400e;font-weight:800}
    .ok{color:#065f46;font-weight:800}
  </style>
</head>
<body>
  <main class="wrap">
    <section class="top">
      <div>
        <div class="pill">🟠 Programmer’s Picnic • Mini Playground</div>
        <h1>Write HTML + CSS + JavaScript → Render + Execute</h1>
        <div class="sub">Runs inside a sandboxed iframe. Console is captured and shown below.</div>
      </div>
      <div class="row">
        <label class="pill" style="cursor:pointer">
          <input id="autoRun" class="chk" type="checkbox" checked />
          Auto-run
        </label>
        <button class="btn" id="btnReset" type="button">↺ Reset</button>
        <button class="btn" id="btnClear" type="button">🧹 Clear Console</button>
        <button class="btn primary" id="btnRun" type="button">▶ Run</button>
      </div>
    </section>

    <section class="layout">
      <!-- Editor -->
      <section class="card">
        <div class="hd">
          <div class="tabs" role="tablist" aria-label="Editors">
            <button class="tab active" data-tab="html" type="button">HTML</button>
            <button class="tab" data-tab="css" type="button">CSS</button>
            <button class="tab" data-tab="js" type="button">JavaScript</button>
          </div>
          <div class="row">
            <span class="pill">Preview updates: <span id="status" class="ok">Ready</span></span>
          </div>
        </div>

        <div class="pane active" id="pane-html">
          <textarea id="codeHtml" spellcheck="false"></textarea>
        </div>
        <div class="pane" id="pane-css">
          <textarea id="codeCss" spellcheck="false"></textarea>
        </div>
        <div class="pane" id="pane-js">
          <textarea id="codeJs" spellcheck="false"></textarea>
        </div>
      </section>

      <!-- Preview + Console -->
      <section class="card previewBox">
        <div class="hd">
          <div class="pill">👀 Preview (sandbox iframe)</div>
          <div class="row">
            <span class="pill muted">Console captured</span>
          </div>
        </div>
        <iframe
          id="preview"
          title="Preview"
          sandbox="allow-scripts allow-forms allow-modals"
        ></iframe>
        <div class="console" id="console"></div>
      </section>
    </section>
  </main>

  <script>
    const $ = (id) => document.getElementById(id);
    const consoleBox = $("console");
    const statusEl = $("status");

    const defaults = {
      html: `<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Hello World</title>
  </head>
  <body>
    <h2 id="title">Hello 👋</h2>
    <button id="btn">Click me</button>
    <p id="msg"></p>
  </body>
</html>`,
      css: `body{font-family:system-ui;margin:18px}
h2{color:#92400e}
button{padding:10px 12px;border-radius:12px;border:1px solid #ddd;cursor:pointer}
#msg{margin-top:10px;font-weight:700}`,
      js: `console.log("Hello from JS!");
document.getElementById("btn").addEventListener("click", () => {
  document.getElementById("msg").textContent = "Button clicked at: " + new Date().toLocaleTimeString();
  console.warn("This is a warning example");
});`
    };

    $("codeHtml").value = defaults.html;
    $("codeCss").value = defaults.css;
    $("codeJs").value = defaults.js;

    function esc(s){ return String(s ?? "").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;"); }

    function logLine(text, cls=""){
      const div = document.createElement("div");
      div.className = "line " + (cls || "");
      div.textContent = text;
      consoleBox.appendChild(div);
      consoleBox.scrollTop = consoleBox.scrollHeight;
    }

    function clearConsole(){
      consoleBox.innerHTML = "";
      logLine("Console ready…", "muted");
    }

    clearConsole();

    // Receive console messages from iframe
    window.addEventListener("message", (ev) => {
      const data = ev.data || {};
      if(data.__pp !== true) return;
      if(data.type === "log"){
        const cls = data.level === "error" ? "err" : (data.level === "warn" ? "warn" : "");
        logLine(data.text, cls);
      }
      if(data.type === "runtimeError"){
        logLine("Runtime Error: " + data.text, "err");
      }
    });

    function buildSrcdoc(html, css, js){
      // Inject console bridge + error handler in the preview frame
      const bridge = `
<script>
(function(){
  function send(type, payload){
    parent.postMessage(Object.assign({__pp:true,type:type}, payload||{}), "*");
  }
  function join(args){
    try{
      return Array.prototype.slice.call(args).map(a=>{
        if(typeof a==="string") return a;
        try { return JSON.stringify(a); } catch(e) { return String(a); }
      }).join(" ");
    }catch(e){ return "[log error]"; }
  }
  ["log","info","warn","error"].forEach(level=>{
    const orig = console[level];
    console[level] = function(){
      send("log", {level: level, text: "["+level+"] " + join(arguments)});
      try { orig.apply(console, arguments); } catch(e) {}
    };
  });

  window.addEventListener("error", function(e){
    send("runtimeError", { text: e.message + " @ " + e.filename + ":" + e.lineno });
  });

  window.addEventListener("unhandledrejection", function(e){
    send("runtimeError", { text: "Unhandled Promise Rejection: " + (e.reason && e.reason.message ? e.reason.message : String(e.reason)) });
  });

  send("log", {level:"info", text:"[info] Preview loaded"});
})();
<\/script>`;

      // Put CSS in head, JS at end of body
      // If user provided a full HTML doc, we still inject our CSS + bridge + JS.
      const styleTag = `<style>${css || ""}<\/style>`;
      const jsTag = `<script>\n${js || ""}\n<\/script>`;

      // Simple injection strategy:
      // - If </head> exists: insert style + bridge before it
      // - Else: prepend them
      // - If </body> exists: insert js before it
      // - Else: append
      let doc = String(html || "");
      if(doc.includes("</head>")) doc = doc.replace("</head>", styleTag + bridge + "\n</head>");
      else doc = styleTag + bridge + "\n" + doc;

      if(doc.includes("</body>")) doc = doc.replace("</body>", jsTag + "\n</body>");
      else doc += "\n" + jsTag;

      return doc;
    }

    function setStatus(text, cls){
      statusEl.textContent = text;
      statusEl.className = cls || "ok";
    }

    function run(){
      clearConsole();
      setStatus("Running…", "warn");

      const html = $("codeHtml").value;
      const css = $("codeCss").value;
      const js = $("codeJs").value;

      const srcdoc = buildSrcdoc(html, css, js);
      $("preview").srcdoc = srcdoc;

      setTimeout(() => setStatus("Ready", "ok"), 200);
    }

    $("btnRun").addEventListener("click", run);

    $("btnReset").addEventListener("click", () => {
      $("codeHtml").value = defaults.html;
      $("codeCss").value = defaults.css;
      $("codeJs").value = defaults.js;
      run();
    });

    $("btnClear").addEventListener("click", clearConsole);

    // Tabs
    document.querySelectorAll(".tab").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".tab").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        const t = btn.getAttribute("data-tab");
        ["html","css","js"].forEach(x => {
          $( "pane-" + x ).classList.toggle("active", x === t);
        });
      });
    });

    // Auto-run debounce
    let debounce = null;
    function maybeAutoRun(){
      if(!$("autoRun").checked) return;
      if(debounce) clearTimeout(debounce);
      setStatus("Typing…", "muted");
      debounce = setTimeout(run, 450);
    }
    ["codeHtml","codeCss","codeJs"].forEach(id => {
      $(id).addEventListener("input", maybeAutoRun);
    });

    // first run
    run();
  </script>
</body>
</html>
