<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>M × N Boolean Grid Highlighter</title>

<style>
*{
    box-sizing: border-box;
}

body{
    font-family: Arial, Helvetica, sans-serif;
    background: #eef8f8;
    text-align: center;
    margin: 20px;
}

h1{
    color: #00695c;
}

.controls{
    margin: 15px 0;
}

input{
    padding: 8px;
    font-size: 16px;
    border: 1px solid #00897b;
    border-radius: 6px;
}

#rows, #cols{
    width: 80px;
    text-align: center;
}

#expression{
    width: 540px;
    max-width: 95%;
}

button{
    padding: 8px 18px;
    font-size: 16px;
    background: #00897b;
    color: white;
    border: none;
    border-radius: 6px;
    cursor: pointer;
}

#error{
    color: red;
    font-weight: bold;
    min-height: 26px;
    margin: 10px;
}

.grid-wrapper{
    width: 95vw;
    max-height: 70vh;
    overflow: auto;
    margin: auto;
    border: 2px solid #00897b;
    border-radius: 10px;
    padding: 10px;
    background: white;
}

#grid{
    display: grid;
    gap: 5px;
    justify-content: start;
}

.cell{
    width: 90px;
    height: 70px;
    border: 2px solid #00897b;
    border-radius: 8px;
    display: flex;
    justify-content: center;
    align-items: center;
    font-weight: bold;
    background: white;
    color: #00695c;
}

.highlight{
    background: gold;
    border-color: red;
    color: black;
}
</style>
</head>

<body>

<h1>M × N Boolean Grid Highlighter</h1>

<div class="controls">
    Rows:
    <input type="number" id="rows" value="7" min="1">

    Columns:
    <input type="number" id="cols" value="7" min="1">

    <button onclick="makeGrid()">Generate Grid</button>
</div>

<div class="controls">
    Expression:
    <input
        type="text"
        id="expression"
        value="(col = 1) and (row <= m)"
        oninput="highlightGrid()"
        placeholder="Example: (row = 1) and (col = n)">
</div>

<div id="error"></div>

<div class="grid-wrapper">
    <div id="grid"></div>
</div>

<script>
let m = 7; // total rows
let n = 7; // total columns

function makeGrid(){
    m = Number(document.getElementById("rows").value);
    n = Number(document.getElementById("cols").value);

    const grid = document.getElementById("grid");
    grid.innerHTML = "";
    grid.style.gridTemplateColumns = `repeat(${n}, 90px)`;

    for(let row = 1; row <= m; row++){
        for(let col = 1; col <= n; col++){
            const cell = document.createElement("div");
            cell.className = "cell";
            cell.dataset.row = row;
            cell.dataset.col = col;
            cell.textContent = `(${row}, ${col})`;
            grid.appendChild(cell);
        }
    }

    highlightGrid();
}

function tokenize(text){
    const tokens = [];
    let i = 0;

    while(i < text.length){
        const ch = text[i];

        if(/\s/.test(ch)){
            i++;
            continue;
        }

        const two = text.slice(i, i + 2);

        if(two === "<=" || two === ">=" || two === "!="){
            tokens.push(two);
            i += 2;
            continue;
        }

        if("=<>()+-*/%".includes(ch)){
            tokens.push(ch);
            i++;
            continue;
        }

        if(/[0-9.]/.test(ch)){
            let num = "";
            while(i < text.length && /[0-9.]/.test(text[i])){
                num += text[i];
                i++;
            }
            tokens.push(num);
            continue;
        }

        if(/[a-zA-Z_]/.test(ch)){
            let word = "";
            while(i < text.length && /[a-zA-Z_]/.test(text[i])){
                word += text[i].toLowerCase();
                i++;
            }
            tokens.push(word);
            continue;
        }

        throw "Invalid character: " + ch;
    }

    return tokens;
}

function evaluateExpression(expression, row, col){
    const tokens = tokenize(expression);
    let index = 0;

    function peek(){
        return tokens[index];
    }

    function next(){
        return tokens[index++];
    }

    function expect(token){
        const found = next();

        if(found !== token){
            throw "Expected " + token + " but found " + found;
        }
    }

    function getVariableValue(name){
        if(name === "row") return row;
        if(name === "col") return col;
        if(name === "m") return m;
        if(name === "n") return n;

        throw "Unknown word: " + name;
    }

    function parseNumberFactor(){
        const token = peek();

        if(token === undefined){
            throw "Number expected";
        }

        if(token === "("){
            next();

            const value = parseNumberExpression();

            expect(")");

            return value;
        }

        if(token === "-"){
            next();
            return -parseNumberFactor();
        }

        if(!isNaN(Number(token))){
            next();
            return Number(token);
        }

        if(["row", "col", "m", "n"].includes(token)){
            next();
            return getVariableValue(token);
        }

        throw "Number expected near: " + token;
    }

    function parseNumberTerm(){
        let value = parseNumberFactor();

        while(peek() === "*" || peek() === "/" || peek() === "%"){
            const op = next();
            const right = parseNumberFactor();

            if(op === "*") value *= right;
            if(op === "/") value /= right;
            if(op === "%") value %= right;
        }

        return value;
    }

    function parseNumberExpression(){
        let value = parseNumberTerm();

        while(peek() === "+" || peek() === "-"){
            const op = next();
            const right = parseNumberTerm();

            if(op === "+") value += right;
            if(op === "-") value -= right;
        }

        return value;
    }

    function parseComparison(){
        const left = parseNumberExpression();
        const op = next();

        if(!["=", "!=", "<", ">", "<=", ">="].includes(op)){
            throw "Boolean comparison expected";
        }

        const right = parseNumberExpression();

        if(op === "=") return left === right;
        if(op === "!=") return left !== right;
        if(op === "<") return left < right;
        if(op === ">") return left > right;
        if(op === "<=") return left <= right;
        if(op === ">=") return left >= right;
    }

    function parseBoolFactor(){
        if(peek() === "not"){
            next();
            return !parseBoolFactor();
        }

        if(peek() === "("){
            next();

            const result = parseBoolExpression();

            expect(")");

            return result;
        }

        return parseComparison();
    }

    function parseBoolTerm(){
        let result = parseBoolFactor();

        while(peek() === "and"){
            next();
            result = result && parseBoolFactor();
        }

        return result;
    }

    function parseBoolExpression(){
        let result = parseBoolTerm();

        while(peek() === "or"){
            next();
            result = result || parseBoolTerm();
        }

        return result;
    }

    const answer = parseBoolExpression();

    if(index < tokens.length){
        throw "Extra text found: " + tokens[index];
    }

    return answer;
}

function highlightGrid(){
    const expression = document.getElementById("expression").value;
    const cells = document.querySelectorAll(".cell");
    const errorBox = document.getElementById("error");

    errorBox.textContent = "";

    for(const cell of cells){
        const row = Number(cell.dataset.row);
        const col = Number(cell.dataset.col);

        try{
            const result = evaluateExpression(expression, row, col);

            if(result){
                cell.classList.add("highlight");
            }else{
                cell.classList.remove("highlight");
            }
        }
        catch(error){
            cell.classList.remove("highlight");
            errorBox.textContent = error;
        }
    }
}

makeGrid();
</script>

</body>
</html>
