<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>JSON Save & Read</title>
  <style>
    body { font-family: Arial; padding:20px; background:#fff8eb }
    textarea { width:100%; height:200px; margin-top:10px }
    input, button { padding:10px; margin-top:10px }
    pre { background:#111; color:#0f0; padding:10px }
  </style>
</head>
<body>

<h2>JSON Save & Read</h2>

<input id="fileName" value="test.json" />

<textarea id="jsonData">
{
  "name": "Champak",
  "city": "Lucknow"
}
</textarea>

<br>
<button onclick="save()">Save JSON</button>
<button onclick="read()">Read JSON</button>

<pre id="output"></pre>

<script>
async function save() {
  const file = document.getElementById("fileName").value;
  const data = document.getElementById("jsonData").value;

  const res = await fetch(`server.learnwithchampak.live/JsonFileHandler.aspx?action=save&file=${file}`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: data
  });

  document.getElementById("output").textContent = await res.text();
}

async function read() {
  const file = document.getElementById("fileName").value;

  const res = await fetch(`server.learnwithchampak.live/JsonFileHandler.aspx?action=read&file=${file}`);
  document.getElementById("output").textContent = await res.text();
}
</script>

</body>
</html>
