<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>MongoDB in Browser — JSON Collections Playground</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />

<link rel="icon"
href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 128 128'%3E%3Crect width='128' height='128' rx='24' fill='%23d97706'/%3E%3Ctext x='64' y='82' font-size='64' text-anchor='middle'%3E%F0%9F%93%9A%3C/text%3E%3C/svg%3E"
/>

<style>
:root{
--bg:#fff7e6;
--card:#ffffff;
--ink:#1f2937;
--brand:#d97706;
--muted:#6b7280;
--border:#f3d7a6;
--ok:#166534;
--danger:#b91c1c;
}
*{box-sizing:border-box}
body{
margin:0;
font-family:Inter,system-ui;
background:linear-gradient(180deg,var(--bg),#fff1d6);
color:var(--ink);
}
.wrap{max-width:1200px;margin:auto;padding:20px}
.card{
background:rgba(255,255,255,0.95);
border:1px solid rgba(0,0,0,0.08);
border-radius:16px;
padding:14px;
margin-bottom:18px;
box-shadow:0 10px 30px rgba(0,0,0,0.05);
}
h1{margin:0;font-size:18px}
.muted{color:var(--muted);font-size:12px;font-weight:800}
textarea,select,input{
width:100%;
padding:10px;
border-radius:10px;
border:1px solid rgba(0,0,0,0.15);
font-family:monospace;
font-size:13px;
}
textarea{min-height:120px;resize:vertical}
button{
padding:8px 12px;
border-radius:10px;
border:none;
font-weight:900;
cursor:pointer;
}
.btn{background:linear-gradient(135deg,#f59e0b,#d97706);color:white}
.btn-outline{background:white;border:1px solid rgba(0,0,0,0.15)}
.btn-ghost{background:transparent;border:1px solid rgba(0,0,0,0.15)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.samples{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{
padding:6px 10px;
border-radius:999px;
border:1px solid rgba(0,0,0,0.15);
background:white;
font-size:12px;
font-weight:900;
cursor:pointer;
}
table{
width:100%;
border-collapse:collapse;
font-family:monospace;
font-size:12px;
}
th,td{
border-bottom:1px solid rgba(0,0,0,0.1);
padding:8px;
text-align:left;
}
.ok{color:var(--ok);font-weight:900}
.danger{color:var(--danger);font-weight:900}
</style>
</head>

<body>
<div class="wrap">

<div class="card">
<h1>MongoDB Playground (In-Browser)</h1>
<div class="muted">Runs entirely on your device. Includes Users, Employees, Orders, and Books.</div>
</div>

<div class="card">

<div class="row">
<div style="flex:1">
<div class="muted">Collection</div>
<select id="collection"></select>
</div>

<div style="flex:1">
<div class="muted">Operation</div>
<select id="operation">
<option value="find">find</option>
<option value="insertOne">insertOne</option>
<option value="insertMany">insertMany</option>
<option value="updateMany">updateMany</option>
<option value="deleteMany">deleteMany</option>
<option value="aggregate">aggregate</option>
</select>
</div>
</div>

<div class="row" style="margin-top:10px">
<div style="flex:1">
<div class="muted">Filter (JSON)</div>
<textarea id="filter">{}</textarea>
</div>

<div style="flex:1">
<div class="muted">Payload (Projection / Update / Docs)</div>
<textarea id="payload">{}</textarea>
</div>
</div>

<div style="margin-top:10px">
<div class="muted">Aggregate Pipeline (JSON Array)</div>
<textarea id="pipeline">[]</textarea>
</div>

<div class="row" style="margin-top:10px">
<button class="btn" onclick="run()">Run</button>
<button class="btn-outline" onclick="resetDB()">Reset Sample DB</button>
</div>

<div class="samples">
<button class="chip" onclick="loadDemo('books_all')">Books: Show All</button>
<button class="chip" onclick="loadDemo('books_rec')">Books: Recursion</button>
<button class="chip" onclick="loadDemo('books_author')">Books: By Champak Roy</button>
<button class="chip" onclick="loadDemo('books_update')">Books: Update Subject</button>
</div>

<div id="output" style="margin-top:14px"></div>

</div>
</div>

<script>
let db;

function sampleDB(){
return{
users:[
{_id:1,name:"Asha",age:22,city:"Delhi",active:true,points:15},
{_id:2,name:"Ravi",age:29,city:"Mumbai",active:true,points:40}
],
employees:[
{_id:"e1",name:"Riya",dept:"Eng",salary:120000},
{_id:"e2",name:"Aman",dept:"HR",salary:90000}
],
orders:[
{_id:"o1",userId:1,total:999,status:"PAID"},
{_id:"o2",userId:2,total:499,status:"CANCEL"}
],
books:[
{BookId:1,BookName:"The Recursion Sutras",Author:"Champak Roy",Subject:"Recursion"},
{BookId:2,BookName:"How to Do Object Oriented Programing?",Author:"Champak Roy",Subject:"OOPS"},
{BookId:3,BookName:"The Big Book of Java Programs",Author:"Champak Roy",Subject:"Java Programming"}
]
};
}

function rebuildCollections(){
const sel=document.getElementById("collection");
sel.innerHTML="";
Object.keys(db).forEach(c=>{
const o=document.createElement("option");
o.value=c;
o.textContent=c;
sel.appendChild(o);
});
}

function resetDB(){
db=sampleDB();
localStorage.setItem("mongoDB",JSON.stringify(db));
rebuildCollections();
document.getElementById("output").innerHTML='<div class="ok">Sample DB Reset</div>';
}

function loadDB(){
let stored=localStorage.getItem("mongoDB");
db=stored?JSON.parse(stored):sampleDB();
rebuildCollections();
}

function renderTable(rows){
if(!rows.length){
document.getElementById("output").innerHTML="No results.";
return;
}
let cols=Object.keys(rows[0]);
let html="<table><thead><tr>";
cols.forEach(c=>html+="<th>"+c+"</th>");
html+="</tr></thead><tbody>";
rows.forEach(r=>{
html+="<tr>";
cols.forEach(c=>html+="<td>"+JSON.stringify(r[c])+"</td>");
html+="</tr>";
});
html+="</tbody></table>";
document.getElementById("output").innerHTML=html;
}

function matches(doc,filter){
for(let k in filter){
if(doc[k]!==filter[k])return false;
}
return true;
}

function run(){
try{
let collection=document.getElementById("collection").value;
let op=document.getElementById("operation").value;
let filter=JSON.parse(document.getElementById("filter").value||"{}");
let payload=JSON.parse(document.getElementById("payload").value||"{}");
let pipeline=JSON.parse(document.getElementById("pipeline").value||"[]");

let coll=db[collection];

if(op==="find"){
let result=coll.filter(d=>matches(d,filter)).map(d=>{
if(Object.keys(payload).length===0)return d;
let o={};
Object.keys(payload).forEach(k=>{
if(payload[k]===1)o[k]=d[k];
});
return o;
});
renderTable(result);
}

else if(op==="insertOne"){
coll.push(payload);
renderTable([payload]);
}

else if(op==="updateMany"){
coll.forEach(d=>{
if(matches(d,filter)){
if(payload.$set){
Object.assign(d,payload.$set);
}
}
});
renderTable(coll);
}

else if(op==="deleteMany"){
db[collection]=coll.filter(d=>!matches(d,filter));
renderTable(db[collection]);
}

else if(op==="aggregate"){
let result=coll;
pipeline.forEach(stage=>{
if(stage.$match){
result=result.filter(d=>matches(d,stage.$match));
}
});
renderTable(result);
}

localStorage.setItem("mongoDB",JSON.stringify(db));
}
catch(e){
document.getElementById("output").innerHTML='<div class="danger">'+e.message+'</div>';
}
}

function loadDemo(id){
if(id==="books_all"){
document.getElementById("collection").value="books";
document.getElementById("operation").value="find";
document.getElementById("filter").value="{}";
document.getElementById("payload").value='{"BookId":1,"BookName":1,"Author":1,"Subject":1}';
}

if(id==="books_rec"){
document.getElementById("collection").value="books";
document.getElementById("operation").value="find";
document.getElementById("filter").value='{"Subject":"Recursion"}';
document.getElementById("payload").value='{"BookName":1,"Author":1}';
}

if(id==="books_author"){
document.getElementById("collection").value="books";
document.getElementById("operation").value="find";
document.getElementById("filter").value='{"Author":"Champak Roy"}';
document.getElementById("payload").value='{"BookName":1,"Subject":1}';
}

if(id==="books_update"){
document.getElementById("collection").value="books";
document.getElementById("operation").value="updateMany";
document.getElementById("filter").value='{"BookId":2}';
document.getElementById("payload").value='{"$set":{"Subject":"Object-Oriented Programming (OOP)"}}';
}
}

loadDB();
</script>

</body>
</html>
