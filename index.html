<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JavaScript Reel Maker</title>
  <script src="js/gif.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      text-align: center;
      padding: 20px;
      background: linear-gradient(180deg, #f0f8ff 0%, #e7f2ff 100%);
      color: #1e293b;
    }

    h2 {
      margin: 10px 0;
    }

    .panel {
      max-width: 920px;
      margin: 0 auto 20px;
      background: #ffffff;
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
    }

    input[type="text"],
    select,
    input[type="file"] {
      width: min(100%, 560px);
      padding: 10px 12px;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      font-size: 15px;
      background: #fff;
    }

    .btn-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin-top: 18px;
    }

    button {
      padding: 12px 18px;
      font-size: 15px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      background: #2563eb;
      color: white;
      transition: transform 0.15s ease, opacity 0.15s ease;
    }

    button:hover {
      transform: translateY(-1px);
      opacity: 0.95;
    }

    #preview {
      margin-top: 20px;
      min-height: 520px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .reel-container {
      position: relative;
      width: 270px;
      height: 480px;
      margin: 0 auto;
      border: 2px solid #cbd5e1;
      overflow: hidden;
      border-radius: 18px;
      background-color: #000;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.25);
      transform-origin: center center;
    }

    .reel-container img,
    .reel-container video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .reel-overlay {
      position: absolute;
      left: 14px;
      right: 14px;
      bottom: 16px;
      color: white;
      font-size: 20px;
      font-weight: bold;
      line-height: 1.3;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.95);
      text-align: center;
      z-index: 2;
      padding: 10px 12px;
      border-radius: 14px;
      background: linear-gradient(to top, rgba(0, 0, 0, 0.55), rgba(0, 0, 0, 0.15));
      backdrop-filter: blur(2px);
      word-break: break-word;
    }

    .animated {
      animation-duration: 1s;
      animation-fill-mode: both;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    @keyframes zoomIn {
      from {
        transform: scale(0.6);
        opacity: 0;
      }

      to {
        transform: scale(1);
        opacity: 1;
      }
    }

    @keyframes flipY {
      from {
        transform: rotateY(180deg);
        opacity: 0;
      }

      to {
        transform: rotateY(0deg);
        opacity: 1;
      }
    }

    @keyframes rotateX {
      from {
        transform: rotateX(90deg);
        opacity: 0;
      }

      to {
        transform: rotateX(0deg);
        opacity: 1;
      }
    }

    @keyframes bounceIn {
      0% {
        transform: scale(0.5);
        opacity: 0;
      }

      60% {
        transform: scale(1.18);
        opacity: 1;
      }

      100% {
        transform: scale(1);
      }
    }

    @keyframes slideUp {
      from {
        transform: translateY(100%);
        opacity: 0;
      }

      to {
        transform: translateY(0);
        opacity: 1;
      }
    }

    @keyframes spinIn {
      from {
        transform: rotate(360deg) scale(0.7);
        opacity: 0;
      }

      to {
        transform: rotate(0deg) scale(1);
        opacity: 1;
      }
    }

    .status {
      display: block;
      margin-top: 10px;
      color: #334155;
      min-height: 22px;
    }

    .download-link {
      display: inline-block;
      margin-top: 8px;
      color: #2563eb;
      font-weight: bold;
      text-decoration: none;
    }

    .helper {
      font-size: 13px;
      color: #64748b;
      margin-top: 8px;
    }
  </style>
</head>

<body>
  <div class="panel">
    <h2>🎬 JavaScript Reel Maker</h2>

    <h2>Select Images and Video</h2>
    <input type="file" id="mediaInput" accept="image/*,video/*" multiple />
    <br><br>

    <h2>Message</h2>
    <input type="text" id="reelText" placeholder="Enter your message..." />
    <br><br>

    <h2>Select Animation</h2>
    <select id="animationType">
      <option value="fadeIn">Fade In</option>
      <option value="zoomIn">Zoom In</option>
      <option value="flipY">Flip Y</option>
      <option value="rotateX">Rotate X</option>
      <option value="bounceIn">Bounce In</option>
      <option value="slideUp">Slide Up</option>
      <option value="spinIn">Spin In</option>
    </select>
    <br><br>

    <h2>Background Music</h2>
    <input type="file" id="bgMusic" accept="audio/*" />

    <div class="btn-row">
      <button onclick="createReel()">🎥 Create Reel</button>
      <button onclick="exportGIF()">📤 Export as GIF</button>
      <button onclick="exportVideo()">🎥 Export as Video (WebM)</button>
      <button onclick="exportVideoWithMusic()">🎧 Export as Video with Music</button>
    </div>

    <small id="gifStatus" class="status"></small>
    <small id="videoStatus" class="status"></small>
    <div class="helper">
      Browser export usually creates WebM, not true MP4.
    </div>

    <div id="preview"></div>
  </div>

  <script>
    const REEL_WIDTH = 270;
    const REEL_HEIGHT = 480;
    const DEFAULT_IMAGE_DURATION = 2000;
    const FPS = 30;
    const ANIMATION_DURATION = 1000;

    let previewAudio = null;
    let previewStopped = false;

    function getFiles() {
      return Array.from(document.getElementById('mediaInput').files || []);
    }

    function getText() {
      return document.getElementById('reelText').value.trim();
    }

    function getAnimation() {
      return document.getElementById('animationType').value;
    }

    function clearStatuses() {
      document.getElementById('gifStatus').innerHTML = '';
      document.getElementById('videoStatus').innerHTML = '';
    }

    function stopPreviewAudio() {
      if (previewAudio) {
        previewAudio.pause();
        previewAudio.currentTime = 0;
        previewAudio = null;
      }
    }

    function stopPreview() {
      previewStopped = true;
      stopPreviewAudio();
    }

    function createOverlay(text) {
      const overlayText = document.createElement('div');
      overlayText.className = 'reel-overlay';
      overlayText.textContent = text || '';
      return overlayText;
    }

    function wait(ms) {
      return new Promise(resolve => setTimeout(resolve, ms));
    }

    async function createReel() {
      clearStatuses();
      stopPreview();

      const preview = document.getElementById('preview');
      const files = getFiles();
      const text = getText();
      const musicFile = document.getElementById('bgMusic').files[0];
      const animation = getAnimation();

      preview.innerHTML = '';

      if (files.length === 0) {
        preview.innerHTML = '<p>Please upload at least one image or video.</p>';
        return;
      }

      previewStopped = false;

      if (musicFile) {
        const musicUrl = URL.createObjectURL(musicFile);
        previewAudio = new Audio(musicUrl);
        try {
          await previewAudio.play();
        } catch (err) {
          console.log('Autoplay blocked.', err);
        }
      }

      for (let i = 0; i < files.length; i++) {
        if (previewStopped) break;

        const file = files[i];
        preview.innerHTML = '';

        const container = document.createElement('div');
        container.className = 'reel-container animated';
        container.style.animationName = animation;

        const overlayText = createOverlay(text);

        if (file.type.startsWith('image/')) {
          const img = document.createElement('img');
          img.src = URL.createObjectURL(file);
          container.appendChild(img);
          container.appendChild(overlayText);
          preview.appendChild(container);
          await wait(DEFAULT_IMAGE_DURATION);
        } else if (file.type.startsWith('video/')) {
          const video = document.createElement('video');
          video.src = URL.createObjectURL(file);
          video.muted = true;
          video.autoplay = true;
          video.playsInline = true;
          container.appendChild(video);
          container.appendChild(overlayText);
          preview.appendChild(container);
          await playVideoForPreview(video);
        }
      }

      stopPreviewAudio();
    }

    function playVideoForPreview(video) {
      return new Promise(resolve => {
        let done = false;

        const finish = () => {
          if (!done) {
            done = true;
            resolve();
          }
        };

        video.onended = finish;
        video.onerror = () => wait(DEFAULT_IMAGE_DURATION).then(finish);

        video.play().catch(() => {
          wait(DEFAULT_IMAGE_DURATION).then(finish);
        });

        setTimeout(finish, 15000);
      });
    }

    function roundRect(ctx, x, y, width, height, radius) {
      ctx.beginPath();
      ctx.moveTo(x + radius, y);
      ctx.lineTo(x + width - radius, y);
      ctx.quadraticCurveTo(x + width, y, x + width, y + radius);
      ctx.lineTo(x + width, y + height - radius);
      ctx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
      ctx.lineTo(x + radius, y + height);
      ctx.quadraticCurveTo(x, y + height, x, y + height - radius);
      ctx.lineTo(x, y + radius);
      ctx.quadraticCurveTo(x, y, x + radius, y);
      ctx.closePath();
    }

    function drawWrappedText(ctx, text, x, y, maxWidth, lineHeight) {
      if (!text) return;

      const words = text.split(' ');
      let line = '';
      const lines = [];

      for (let i = 0; i < words.length; i++) {
        const testLine = line + words[i] + ' ';
        const width = ctx.measureText(testLine).width;
        if (width > maxWidth && i > 0) {
          lines.push(line.trim());
          line = words[i] + ' ';
        } else {
          line = testLine;
        }
      }

      if (line.trim()) lines.push(line.trim());

      const totalHeight = lines.length * lineHeight;
      const startY = y - totalHeight / 2 + lineHeight / 2;

      lines.forEach((ln, index) => {
        ctx.fillText(ln, x, startY + index * lineHeight);
      });
    }

    function drawOverlayOnCanvas(ctx, text) {
      if (!text) return;

      const padding = 14;
      const boxHeight = 90;

      ctx.fillStyle = 'rgba(0,0,0,0.35)';
      roundRect(ctx, padding, REEL_HEIGHT - boxHeight - 14, REEL_WIDTH - padding * 2, boxHeight, 16);
      ctx.fill();

      ctx.font = 'bold 20px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillStyle = 'white';

      drawWrappedText(ctx, text, REEL_WIDTH / 2, REEL_HEIGHT - 52, REEL_WIDTH - 44, 24);
    }

    function loadImageFromFile(file) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        const url = URL.createObjectURL(file);

        img.onload = () => resolve({ img, url });
        img.onerror = reject;
        img.src = url;
      });
    }

    function getAnimationState(type, progress) {
      progress = Math.max(0, Math.min(1, progress));

      let alpha = 1;
      let scale = 1;
      let tx = 0;
      let ty = 0;
      let rotation = 0;

      switch (type) {
        case 'fadeIn':
          alpha = progress;
          break;

        case 'zoomIn':
          alpha = progress;
          scale = 0.6 + 0.4 * progress;
          break;

        case 'flipY':
          alpha = progress;
          scale = Math.abs(Math.cos((1 - progress) * Math.PI * 0.5));
          scale = Math.max(scale, 0.05);
          break;

        case 'rotateX':
          alpha = progress;
          scale = Math.abs(Math.cos((1 - progress) * Math.PI * 0.5));
          scale = Math.max(scale, 0.05);
          break;

        case 'bounceIn':
          alpha = progress;
          if (progress < 0.6) {
            scale = 0.5 + (1.2 - 0.5) * (progress / 0.6);
          } else {
            scale = 1.2 - 0.2 * ((progress - 0.6) / 0.4);
          }
          break;

        case 'slideUp':
          alpha = progress;
          ty = (1 - progress) * REEL_HEIGHT;
          break;

        case 'spinIn':
          alpha = progress;
          rotation = (1 - progress) * Math.PI * 2;
          scale = 0.7 + 0.3 * progress;
          break;

        default:
          alpha = 1;
          scale = 1;
      }

      return { alpha, scale, tx, ty, rotation };
    }

    function drawFrameBase(ctx, drawMedia, text, animationType, elapsedMs) {
      const progress = Math.min(elapsedMs / ANIMATION_DURATION, 1);
      const state = getAnimationState(animationType, progress);

      ctx.clearRect(0, 0, REEL_WIDTH, REEL_HEIGHT);
      ctx.fillStyle = 'black';
      ctx.fillRect(0, 0, REEL_WIDTH, REEL_HEIGHT);

      ctx.save();
      ctx.globalAlpha = state.alpha;
      ctx.translate(REEL_WIDTH / 2 + state.tx, REEL_HEIGHT / 2 + state.ty);
      ctx.rotate(state.rotation);
      ctx.scale(state.scale, state.scale);
      drawMedia(ctx);
      ctx.restore();

      drawOverlayOnCanvas(ctx, text);
    }

    async function recordAnimatedImageFrames(file, ctx, text, animationType, addGifFrame, waitRealTime) {
      const { img, url } = await loadImageFromFile(file);

      const totalFrames = Math.round((DEFAULT_IMAGE_DURATION / 1000) * FPS);
      const frameDelay = Math.round(1000 / FPS);

      const drawMedia = (ctx2) => {
        ctx2.drawImage(img, -REEL_WIDTH / 2, -REEL_HEIGHT / 2, REEL_WIDTH, REEL_HEIGHT);
      };

      for (let i = 0; i < totalFrames; i++) {
        const elapsed = i * frameDelay;
        drawFrameBase(ctx, drawMedia, text, animationType, elapsed);

        if (addGifFrame) {
          addGifFrame(frameDelay);
        }

        if (waitRealTime) {
          await wait(frameDelay);
        }
      }

      URL.revokeObjectURL(url);
    }

    async function exportGIF() {
      clearStatuses();

      const files = getFiles();
      const text = getText();
      const animationType = getAnimation();
      const status = document.getElementById('gifStatus');

      if (files.length === 0) {
        alert("Upload at least one image or video to export.");
        return;
      }

      status.textContent = "Creating GIF... please wait.";

      const gif = new GIF({
        workers: 2,
        quality: 10,
        workerScript: "js/gif.worker.js",
        width: REEL_WIDTH,
        height: REEL_HEIGHT
      });

      const canvas = document.createElement('canvas');
      canvas.width = REEL_WIDTH;
      canvas.height = REEL_HEIGHT;
      const ctx = canvas.getContext('2d');

      for (const file of files) {
        if (!file.type.startsWith('image/')) {
          continue;
        }

        try {
          await recordAnimatedImageFrames(
            file,
            ctx,
            text,
            animationType,
            (delay) => gif.addFrame(canvas, { copy: true, delay }),
            false
          );
        } catch (err) {
          console.error('GIF export skipped file:', file.name, err);
        }
      }

      gif.on('finished', function (blob) {
        const url = URL.createObjectURL(blob);
        status.innerHTML = '';
        const link = document.createElement('a');
        link.href = url;
        link.download = 'reel.gif';
        link.className = 'download-link';
        link.textContent = '⬇️ Download your GIF';
        status.appendChild(link);
      });

      gif.render();
    }

    async function exportVideo() {
      clearStatuses();

      const files = getFiles();
      const text = getText();
      const animationType = getAnimation();
      const status = document.getElementById('videoStatus');

      if (files.length === 0) {
        alert("Upload at least one image or video to export.");
        return;
      }

      status.textContent = "Rendering video... please wait.";

      const canvas = document.createElement('canvas');
      canvas.width = REEL_WIDTH;
      canvas.height = REEL_HEIGHT;
      const ctx = canvas.getContext('2d');

      const stream = canvas.captureStream(FPS);
      const recorder = new MediaRecorder(stream, { mimeType: 'video/webm' });
      const chunks = [];

      recorder.ondataavailable = e => {
        if (e.data && e.data.size > 0) chunks.push(e.data);
      };

      recorder.onstop = () => {
        const blob = new Blob(chunks, { type: 'video/webm' });
        const url = URL.createObjectURL(blob);
        status.innerHTML = '';
        const link = document.createElement('a');
        link.href = url;
        link.download = 'reel.webm';
        link.className = 'download-link';
        link.textContent = '⬇️ Download your video';
        status.appendChild(link);
      };

      recorder.start();

      for (const file of files) {
        if (file.type.startsWith('image/')) {
          try {
            await recordAnimatedImageFrames(file, ctx, text, animationType, null, true);
          } catch (err) {
            console.error('Video export skipped image:', file.name, err);
          }
        } else if (file.type.startsWith('video/')) {
          await recordAnimatedVideoFrames(file, ctx, text, animationType);
        }
      }

      recorder.stop();
    }

    async function exportVideoWithMusic() {
      clearStatuses();

      const files = getFiles();
      const text = getText();
      const animationType = getAnimation();
      const musicFile = document.getElementById('bgMusic').files[0];
      const status = document.getElementById('videoStatus');

      if (files.length === 0 || !musicFile) {
        alert("Please upload both media and a music file.");
        return;
      }

      status.textContent = "Rendering video with background music...";

      const canvas = document.createElement('canvas');
      canvas.width = REEL_WIDTH;
      canvas.height = REEL_HEIGHT;
      const ctx = canvas.getContext('2d');

      const videoStream = canvas.captureStream(FPS);

      const audioContext = new (window.AudioContext || window.webkitAudioContext)();
      const destination = audioContext.createMediaStreamDestination();

      const musicBuffer = await musicFile.arrayBuffer();
      const decodedAudio = await audioContext.decodeAudioData(musicBuffer.slice(0));

      const sourceNode = audioContext.createBufferSource();
      sourceNode.buffer = decodedAudio;
      sourceNode.connect(destination);

      const mixedStream = new MediaStream([
        ...videoStream.getVideoTracks(),
        ...destination.stream.getAudioTracks()
      ]);

      const recorder = new MediaRecorder(mixedStream, { mimeType: 'video/webm' });
      const chunks = [];

      recorder.ondataavailable = e => {
        if (e.data && e.data.size > 0) chunks.push(e.data);
      };

      recorder.onstop = () => {
        const blob = new Blob(chunks, { type: 'video/webm' });
        const url = URL.createObjectURL(blob);
        status.innerHTML = '';
        const link = document.createElement('a');
        link.href = url;
        link.download = 'reel_with_music.webm';
        link.className = 'download-link';
        link.textContent = '⬇️ Download reel with music';
        status.appendChild(link);
      };

      recorder.start();
      sourceNode.start(0);

      for (const file of files) {
        if (file.type.startsWith('image/')) {
          try {
            await recordAnimatedImageFrames(file, ctx, text, animationType, null, true);
          } catch (err) {
            console.error('Video+music export skipped image:', file.name, err);
          }
        } else if (file.type.startsWith('video/')) {
          await recordAnimatedVideoFrames(file, ctx, text, animationType);
        }
      }

      recorder.stop();
      sourceNode.stop();
    }

    function recordAnimatedVideoFrames(file, ctx, text, animationType) {
      return new Promise((resolve) => {
        const video = document.createElement('video');
        const url = URL.createObjectURL(file);
        video.src = url;
        video.muted = true;
        video.playsInline = true;
        video.preload = 'auto';

        let rafId = null;
        let startTs = null;

        const cleanup = () => {
          if (rafId) cancelAnimationFrame(rafId);
          URL.revokeObjectURL(url);
          resolve();
        };

        const drawLoop = (ts) => {
          if (startTs === null) startTs = ts;
          const elapsed = ts - startTs;

          const drawMedia = (ctx2) => {
            ctx2.drawImage(video, -REEL_WIDTH / 2, -REEL_HEIGHT / 2, REEL_WIDTH, REEL_HEIGHT);
          };

          drawFrameBase(ctx, drawMedia, text, animationType, elapsed);

          if (!video.paused && !video.ended) {
            rafId = requestAnimationFrame(drawLoop);
          }
        };

        video.onended = cleanup;
        video.onerror = async () => {
          await wait(DEFAULT_IMAGE_DURATION);
          cleanup();
        };

        video.onloadeddata = () => {
          video.play().then(() => {
            rafId = requestAnimationFrame(drawLoop);
          }).catch(async () => {
            await wait(DEFAULT_IMAGE_DURATION);
            cleanup();
          });
        };
      });
    }
  </script>
</body>

</html>
