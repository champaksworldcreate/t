<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reel Maker V4 Ultra</title>
<script src="js/gif.js"></script>

<style>
body{font-family:sans-serif;background:#eef4ff;padding:20px;text-align:center;}
.reel{width:270px;height:480px;margin:auto;position:relative;background:#000;border-radius:16px;overflow:hidden;}
.reel img,.reel video{width:100%;height:100%;object-fit:cover;}
.overlay{position:absolute;left:10px;right:10px;bottom:20px;padding:10px;border-radius:10px;color:#fff;font-weight:bold;text-align:center;}
.overlay-animated{animation:fadeUp .8s ease;}
@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1}}
</style>
</head>

<body>

<h2>🎬 Reel Maker V4 Ultra</h2>

<input type="file" id="media" multiple><br><br>
<input type="text" id="text" placeholder="Caption"><br><br>

<select id="textAnim">
<option value="fadeUp">Fade Up</option>
<option value="zoom">Zoom</option>
<option value="slide">Slide</option>
<option value="none">None</option>
</select><br><br>

<button onclick="preview()">Preview</button>
<button onclick="exportVideo()">Export Video</button>

<div id="screen" class="reel"></div>

<script>
let slides=[];

function preview(){
const files=document.getElementById('media').files;
const text=document.getElementById('text').value;
const anim=document.getElementById('textAnim').value;
const screen=document.getElementById('screen');

slides=[...files];

let i=0;

function show(){
if(i>=slides.length)return;

const file=slides[i];
const reader=new FileReader();

reader.onload=e=>{
screen.innerHTML="";

let el;
if(file.type.startsWith('image')){
el=document.createElement('img');
}else{
el=document.createElement('video');
el.autoplay=true;
}
el.src=e.target.result;
screen.appendChild(el);

const overlay=document.createElement('div');
overlay.className="overlay overlay-animated";

if(anim==="zoom") overlay.style.animation="zoom .8s";
if(anim==="slide") overlay.style.animation="slide .8s";
if(anim==="none") overlay.style.animation="none";

overlay.innerText=text;
screen.appendChild(overlay);

i++;
setTimeout(show,2000);
};

reader.readAsDataURL(file);
}

show();
}

function exportVideo(){
alert("Export works in full version (canvas recording).");
}
</script>

<style>
@keyframes zoom{from{transform:scale(.5);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes slide{from{transform:translateX(50px);opacity:0}to{transform:translateX(0);opacity:1}}
</style>

</body>
</html>
