<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="980" viewBox="0 0 1100 980">
  <defs>
    <style>
      .bg { fill: #fffaf3; }
      .box { fill: #ffffff; stroke: #d97706; stroke-width: 2.2; rx: 14; ry: 14; }
      .decision { fill: #fff; stroke: #b45309; stroke-width: 2.2; }
      .term { fill: #ffedd5; stroke: #c2410c; stroke-width: 2.4; rx: 24; ry: 24; }
      .io { fill: #fff7ed; stroke: #ea580c; stroke-width: 2.2; }
      .line { stroke: #7c2d12; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
      .label { font: 20px Arial, sans-serif; fill: #431407; font-weight: 600; }
      .small { font: 17px Arial, sans-serif; fill: #431407; }
      .tiny { font: 15px Arial, sans-serif; fill: #7c2d12; }
    </style>

    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#7c2d12"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1100" height="980"/>

  <!-- Start -->
  <rect class="term" x="410" y="30" width="280" height="60"/>
  <text class="label" x="550" y="68" text-anchor="middle">Start</text>

  <!-- Input -->
  <polygon class="io" points="340,125 760,125 720,185 300,185"/>
  <text class="label" x="530" y="162" text-anchor="middle">Input string s</text>

  <!-- Init -->
  <rect class="box" x="340" y="220" width="420" height="72"/>
  <text class="label" x="550" y="250" text-anchor="middle">Initialize</text>
  <text class="small" x="550" y="277" text-anchor="middle">i = 0, j = length(s) - 1</text>

  <!-- Loop condition -->
  <polygon class="decision" points="550,325 710,390 550,455 390,390"/>
  <text class="label" x="550" y="385" text-anchor="middle">i &lt; j ?</text>

  <!-- Compare -->
  <polygon class="decision" points="550,500 740,570 550,640 360,570"/>
  <text class="label" x="550" y="562" text-anchor="middle">s[i] == s[j] ?</text>

  <!-- Move inward -->
  <rect class="box" x="790" y="535" width="230" height="70"/>
  <text class="small" x="905" y="565" text-anchor="middle">i = i + 1</text>
  <text class="small" x="905" y="592" text-anchor="middle">j = j - 1</text>

  <!-- Check skip left -->
  <polygon class="decision" points="320,690 500,755 320,820 140,755"/>
  <text class="small" x="320" y="748" text-anchor="middle">Is s[i+1 ... j]</text>
  <text class="small" x="320" y="772" text-anchor="middle">a palindrome?</text>

  <!-- Remove left -->
  <rect class="box" x="40" y="860" width="250" height="74"/>
  <text class="small" x="165" y="892" text-anchor="middle">Yes → one char missing</text>
  <text class="small" x="165" y="918" text-anchor="middle">Remove s[i]</text>

  <!-- Check skip right -->
  <polygon class="decision" points="610,690 790,755 610,820 430,755"/>
  <text class="small" x="610" y="748" text-anchor="middle">Is s[i ... j-1]</text>
  <text class="small" x="610" y="772" text-anchor="middle">a palindrome?</text>

  <!-- Remove right -->
  <rect class="box" x="490" y="860" width="250" height="74"/>
  <text class="small" x="615" y="892" text-anchor="middle">Yes → one char missing</text>
  <text class="small" x="615" y="918" text-anchor="middle">Remove s[j]</text>

  <!-- Not possible -->
  <rect class="box" x="820" y="720" width="220" height="70"/>
  <text class="small" x="930" y="748" text-anchor="middle">No</text>
  <text class="small" x="930" y="774" text-anchor="middle">Not possible</text>

  <!-- Already palindrome -->
  <rect class="box" x="790" y="340" width="250" height="70"/>
  <text class="small" x="915" y="368" text-anchor="middle">Loop ended</text>
  <text class="small" x="915" y="395" text-anchor="middle">Already palindrome</text>

  <!-- End -->
  <rect class="term" x="805" y="885" width="250" height="60"/>
  <text class="label" x="930" y="922" text-anchor="middle">End</text>

  <!-- Arrows -->
  <path class="line" d="M550 90 L550 125"/>
  <path class="line" d="M550 185 L550 220"/>
  <path class="line" d="M550 292 L550 325"/>

  <!-- i < j ? yes -->
  <path class="line" d="M550 455 L550 500"/>
  <text class="tiny" x="565" y="482">Yes</text>

  <!-- i < j ? no -->
  <path class="line" d="M710 390 L790 390"/>
  <text class="tiny" x="735" y="378">No</text>

  <!-- compare yes -->
  <path class="line" d="M740 570 L790 570"/>
  <text class="tiny" x="754" y="557">Yes</text>

  <!-- move inward back to loop -->
  <path class="line" d="M905 535 L905 300 L550 300 L550 325"/>
  <text class="tiny" x="916" y="430">repeat</text>

  <!-- compare no to skip left -->
  <path class="line" d="M420 612 L320 690"/>
  <text class="tiny" x="375" y="650">No</text>

  <!-- skip left yes -->
  <path class="line" d="M230 805 L190 860"/>
  <text class="tiny" x="205" y="836">Yes</text>

  <!-- skip left no to skip right -->
  <path class="line" d="M500 755 L430 755"/>
  <text class="tiny" x="455" y="742">No</text>

  <!-- skip right yes -->
  <path class="line" d="M610 820 L615 860"/>
  <text class="tiny" x="625" y="842">Yes</text>

  <!-- skip right no -->
  <path class="line" d="M790 755 L820 755"/>
  <text class="tiny" x="800" y="742">No</text>

  <!-- to end -->
  <path class="line" d="M290 897 L805 915"/>
  <path class="line" d="M740 897 L805 915"/>
  <path class="line" d="M1040 755 L1040 915 L1055 915"/>
  <path class="line" d="M915 410 L915 885"/>

  <!-- Title -->
  <text class="label" x="550" y="965" text-anchor="middle">
    Flowchart: Check whether string can become palindrome by removing one character
  </text>
</svg>
