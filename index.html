<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Programmer's Picnic — Solve Maths from Image</title>

<meta name="theme-color" content="#d97706" />

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script src="https://cdn.jsdelivr.net/pyodide/v0.27.2/full/pyodide.js"></script>

<style>
:root{
  --bg:#fff8ef;
  --brand:#d97706;
  --text:#1f2937;
  --line:rgba(217,119,6,0.2);
}

body{
  margin:0;
  font-family:Inter,system-ui;
  background:var(--bg);
  color:var(--text);
}

.wrap{
  max-width:1200px;
  margin:auto;
  padding:20px;
}

h1{
  margin-bottom:10px;
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:20px;
}

.card{
  background:#fff;
  padding:16px;
  border-radius:16px;
  border:1px solid var(--line);
}

button,label{
  padding:10px 14px;
  border-radius:999px;
  border:none;
  cursor:pointer;
  background:var(--brand);
  color:#fff;
  font-weight:600;
}

button.secondary,label.secondary{
  background:#fff;
  color:var(--brand);
  border:1px solid var(--line);
}

.row{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  margin-bottom:10px;
}

video,canvas,img{
  width:100%;
  border-radius:12px;
  border:1px solid var(--line);
  margin-top:10px;
}

textarea,pre{
  width:100%;
  padding:10px;
  border-radius:10px;
  border:1px solid var(--line);
  margin-top:10px;
  font-family:monospace;
}

iframe{
  width:100%;
  height:700px;
  border-radius:12px;
  border:1px solid var(--line);
}

input[type=file]{
  display:none;
}

@media(max-width:900px){
  .grid{grid-template-columns:1fr;}
}
</style>
</head>

<body>
<div class="wrap">

<h1>Solve Maths from Image (NumPy)</h1>

<div class="grid">

<div class="card">

<div class="row">
<button id="startCamera">Camera</button>
<button id="capture" class="secondary">Capture</button>

<label for="fileInput" class="secondary">Upload</label>
<input id="fileInput" type="file" accept="image/*">

<button id="ocrBtn" class="secondary">OCR</button>
<button id="solveBtn" class="secondary">Generate Code</button>
<button id="runBtn" class="secondary">Run</button>
</div>

<video id="video" autoplay playsinline></video>
<img id="preview" hidden>
<canvas id="canvas"></canvas>

<textarea id="ocrText" placeholder="OCR text..."></textarea>
<textarea id="code" placeholder="Generated NumPy code..."></textarea>

<div class="row">
<button id="copy">Copy</button>
<button id="load">Load into Editor</button>
</div>

<pre id="output">Output...</pre>

</div>

<div class="card">
<h3>Python Editor</h3>
<iframe id="editor"></iframe>
</div>

</div>
</div>

<script>
const EDITOR_URL = "https://editor.learnwithchampak.live/python-starter/editor/super/?tmode=1";

const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const preview = document.getElementById("preview");

const ocrText = document.getElementById("ocrText");
const codeBox = document.getElementById("code");
const output = document.getElementById("output");

const editor = document.getElementById("editor");
editor.src = EDITOR_URL;

let stream;
let pyodide;

// CAMERA
document.getElementById("startCamera").onclick = async ()=>{
  stream = await navigator.mediaDevices.getUserMedia({video:true});
  video.srcObject = stream;
};

document.getElementById("capture").onclick = ()=>{
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  ctx.drawImage(video,0,0);
};

// UPLOAD
document.getElementById("fileInput").onchange = e=>{
  const file = e.target.files[0];
  const reader = new FileReader();
  reader.onload = ()=>{
    preview.src = reader.result;
    preview.hidden = false;

    const img = new Image();
    img.onload = ()=>{
      canvas.width = img.width;
      canvas.height = img.height;
      ctx.drawImage(img,0,0);
    };
    img.src = reader.result;
  };
  reader.readAsDataURL(file);
};

// OCR
document.getElementById("ocrBtn").onclick = async ()=>{
  const res = await Tesseract.recognize(canvas,"eng");
  ocrText.value = res.data.text;
};

// SIMPLE PARSER
function generateCode(text){
  text = text.replace(/\s/g,"");

  if(text.includes("x^2") || text.includes("x**2")){
    return `import numpy as np

coeff = [1,-5,6]
print(np.roots(coeff))`;
  }

  return `import numpy as np

a = 2
b = 10
x = b/a
print("x =",x)`;
}

// GENERATE
document.getElementById("solveBtn").onclick = ()=>{
  codeBox.value = generateCode(ocrText.value);
};

// RUN
document.getElementById("runBtn").onclick = async ()=>{
  if(!pyodide){
    pyodide = await loadPyodide();
    await pyodide.loadPackage("numpy");
  }

  let out=[];
  pyodide.setStdout({batched:(s)=>out.push(s)});

  await pyodide.runPythonAsync(codeBox.value);

  output.textContent = out.join("\n");
};

// COPY
document.getElementById("copy").onclick = ()=>{
  navigator.clipboard.writeText(codeBox.value);
};

// LOAD INTO EDITOR
document.getElementById("load").onclick = ()=>{
  const encoded = encodeURIComponent(codeBox.value);
  editor.src = EDITOR_URL + "#code=" + encoded;
};
</script>

</body>
</html>
