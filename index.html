<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Man Goat Tiger Grass Puzzle</title>

<style>
:root {
  --saffron:#d97706;
  --bg:#fff8ef;
  --panel:#ffffff;
  --line:#f1c27d;
}

body{
  margin:0;
  font-family:system-ui;
  background:var(--bg);
  text-align:center;
}

h1{
  margin:10px 0;
  color:var(--saffron);
}

.container{
  display:flex;
  justify-content:space-around;
  margin-top:20px;
}

.bank{
  width:40%;
  min-height:250px;
  background:var(--panel);
  border:2px dashed var(--line);
  border-radius:12px;
  padding:10px;
}

.river{
  width:20%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:24px;
}

.item{
  padding:10px;
  margin:8px;
  background:#fde68a;
  border-radius:10px;
  cursor:pointer;
  user-select:none;
}

.selected{
  background:#fbbf24;
}

.controls{
  margin-top:20px;
}

button{
  padding:10px 15px;
  margin:5px;
  border:none;
  border-radius:8px;
  background:var(--saffron);
  color:white;
  cursor:pointer;
}

.log{
  margin-top:15px;
  font-size:14px;
  color:#555;
}

.win{
  color:green;
  font-weight:bold;
}
</style>
</head>

<body>

<h1>Man, Goat, Tiger, Grass Puzzle</h1>

<div class="container">
  <div class="bank" id="left">
    <h3>Left Bank</h3>
  </div>

  <div class="river">🌊</div>

  <div class="bank" id="right">
    <h3>Right Bank</h3>
  </div>
</div>

<div class="controls">
  <button onclick="move()">Move</button>
  <button onclick="undo()">Undo</button>
  <button onclick="resetGame()">Reset</button>
  <button onclick="autoPlay()">Auto Play</button>
</div>

<div class="log" id="log"></div>

<script>
let state = {
  left: ["man","goat","tiger","grass"],
  right: [],
  boat: "left",
  selected: null,
  history: []
};

function render(){
  document.getElementById("left").innerHTML="<h3>Left Bank</h3>";
  document.getElementById("right").innerHTML="<h3>Right Bank</h3>";

  state.left.forEach(item=>{
    let el=createItem(item,"left");
    document.getElementById("left").appendChild(el);
  });

  state.right.forEach(item=>{
    let el=createItem(item,"right");
    document.getElementById("right").appendChild(el);
  });

  checkWin();
}

function createItem(name,side){
  let el=document.createElement("div");
  el.className="item";
  el.innerText=name;

  if(state.selected===name) el.classList.add("selected");

  el.onclick=()=>{
    if(side===state.boat){
      state.selected = (state.selected===name)?null:name;
      render();
    }
  };

  return el;
}

function move(){
  let from = state.boat;
  let to = (from==="left")?"right":"left";

  let newState = JSON.parse(JSON.stringify(state));

  if(state.selected){
    let index = newState[from].indexOf(state.selected);
    if(index===-1) return;

    newState[from].splice(index,1);
    newState[to].push(state.selected);
  }

  newState.boat = to;
  newState.selected = null;

  if(!isValid(newState)){
    log("❌ Invalid move!");
    return;
  }

  state.history.push(JSON.stringify(state));
  state = newState;
  log("Moved");
  render();
}

function isValid(s){
  function bad(side){
    if(side.includes("goat") && side.includes("grass") && !side.includes("man")) return true;
    if(side.includes("tiger") && side.includes("goat") && !side.includes("man")) return true;
    return false;
  }

  return !(bad(s.left) || bad(s.right));
}

function undo(){
  if(state.history.length===0) return;
  state = JSON.parse(state.history.pop());
  render();
}

function resetGame(){
  state = {
    left:["man","goat","tiger","grass"],
    right:[],
    boat:"left",
    selected:null,
    history:[]
  };
  log("Game reset");
  render();
}

function checkWin(){
  if(state.right.length===4){
    document.getElementById("log").innerHTML="<span class='win'>🎉 You solved it!</span>";
  }
}

function log(msg){
  document.getElementById("log").innerText = msg;
}

// AUTO PLAY SOLUTION
async function autoPlay(){
  resetGame();
  const steps = [
    "goat","",
    "tiger","goat",
    "grass","",
    "goat"
  ];

  for(let s of steps){
    await new Promise(r=>setTimeout(r,800));

    if(s){
      state.selected = s;
    } else {
      state.selected = null;
    }

    move();
  }
}

render();
</script>

</body>
</html>
