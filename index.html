<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Site Search</title>
  <style>
    body{
      font-family: Arial, sans-serif;
      margin:0;
      min-height:100vh;
      display:grid;
      place-items:center;
      background:#f7f7f7;
    }
    .box{
      background:#fff;
      padding:24px;
      border-radius:16px;
      box-shadow:0 10px 30px rgba(0,0,0,.08);
      width:min(90vw,520px);
    }
    h1{margin-top:0}
    .row{
      display:flex;
      gap:10px;
    }
    input{
      flex:1;
      padding:12px 14px;
      border:1px solid #ccc;
      border-radius:10px;
      font-size:16px;
    }
    button{
      padding:12px 18px;
      border:none;
      border-radius:10px;
      cursor:pointer;
      font-size:16px;
    }
  </style>
</head>
<body>
  <div class="box">
    <h1>Search this site</h1>
    <div class="row">
      <input id="q" type="text" placeholder="Enter search term" />
      <button onclick="searchSite()">Search</button>
    </div>
  </div>

  <script>
    function searchSite() {
      const query = document.getElementById("q").value.trim();
      const site = "punyayatra.in"; // change this
      if (!query) return;

      const url =
        "https://www.google.com/search?q=" +
        encodeURIComponent("site:" + site + " " + query);

      window.open(url, "_blank");
    }

    document.getElementById("q").addEventListener("keydown", function(e){
      if(e.key === "Enter") searchSite();
    });
  </script>
</body>
</html>
