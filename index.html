<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Programmer's Picnic — JavaScript Editor</title>

<style>
:root{
--bg:#fff7e6;
--card:#ffffff;
--ink:#1f2937;
--muted:#6b7280;
--brand:#d97706;
--brand2:#f59e0b;
--border:#eadcc5;
--shadow:0 18px 40px rgba(31,41,55,.14);
--codebg:#0b1220;
--codeink:#e5e7eb;
--ok:#22c55e;
--bad:#ef4444;
--warn:#f59e0b;
--r:18px;
--mono:ui-monospace,Menlo,Consolas,"SF Mono",monospace;
}

*{box-sizing:border-box}
body{
margin:0;
font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
color:var(--ink);
background:
radial-gradient(1200px 600px at 15% -10%,rgba(245,158,11,.18),transparent 55%),
radial-gradient(900px 500px at 85% 0%,rgba(217,119,6,.16),transparent 60%),
linear-gradient(180deg,var(--bg),#fff);
}

.wrap{max-width:1320px;margin:16px auto;padding:14px}

.top{
display:flex;
justify-content:space-between;
align-items:center;
flex-wrap:wrap;
gap:10px;
margin-bottom:12px;
}

h1{margin:0;font-size:18px}

.btnbar{display:flex;gap:8px;flex-wrap:wrap}

.btn{
border:1px solid var(--border);
background:#fff;
border-radius:14px;
padding:8px 12px;
font-weight:900;
cursor:pointer;
}
.btn.primary{background:linear-gradient(180deg,var(--brand2),var(--brand));border:0}
.btn:active{transform:translateY(1px)}

.grid{
display:grid;
grid-template-columns:1.35fr .65fr;
gap:12px;
}
@media(max-width:980px){
.grid{grid-template-columns:1fr}
}

.card{
background:var(--card);
border:1px solid var(--border);
border-radius:var(--r);
box-shadow:var(--shadow);
}

textarea.editor{
width:100%;
min-height:520px;
border:0;
outline:none;
padding:12px;
background:var(--codebg);
color:var(--codeink);
font-family:var(--mono);
font-size:14px;
line-height:1.5;
white-space:pre;
}

.side{padding:12px}

.out{
background:#020617;
color:#e5e7eb;
font-family:var(--mono);
min-height:200px;
padding:12px;
border-radius:14px;
white-space:pre-wrap;
}
</style>
</head>

<body>

<div class="wrap">
<div class="top">
<h1>🧠 Programmer's Picnic — JavaScript Editor</h1>

<div class="btnbar">
<button class="btn primary" id="run">▶ Run</button>
<button class="btn" id="share">🔗 Share App</button>

<!-- NEW BUTTON -->
<button class="btn" id="shareCode">🧾 Code Share</button>

<button class="btn" id="download">⬇ Download</button>
</div>
</div>

<div class="grid">

<div class="card">
<textarea id="editor" class="editor">
// Example
function solve(input){
return Number(input)*2;
}
console.log(solve(5));
</textarea>
</div>

<div class="card side">
<h3>Output</h3>
<div class="out" id="out"></div>
</div>

</div>
</div>

<script>

// Basic runner
document.getElementById("run").onclick = function(){
const code = document.getElementById("editor").value;
const out = document.getElementById("out");
out.textContent = "";
try{
const result = new Function(code)();
if(result!==undefined){
out.textContent += "→ result: "+JSON.stringify(result);
}
}catch(e){
out.textContent = "Error: "+e.message;
}
};


// ============================
// 🔗 Share App (existing)
// ============================
document.getElementById("share").onclick = async function(){
const url = location.href;
try{
await navigator.clipboard.writeText(url);
alert("App link copied!");
}catch{
window.open("https://wa.me/?text="+encodeURIComponent(url));
}
};


// ============================
// 🧾 NEW CODE SHARE BUTTON
// ============================
document.getElementById("shareCode").onclick = async function(){

const code = document.getElementById("editor").value;

const text =
`🧠 Programmer's Picnic — JS Code Share

--- CODE ---
${code}
`;

try{
await navigator.clipboard.writeText(text);
document.getElementById("out").textContent =
"🧾 Code copied to clipboard.\nPaste it anywhere.";
}catch{
window.open(
"https://wa.me/?text="+encodeURIComponent(text),
"_blank"
);
document.getElementById("out").textContent =
"Opened WhatsApp Code Share.";
}
};


// ============================
// Download
// ============================
document.getElementById("download").onclick = function(){
const blob = new Blob([document.documentElement.outerHTML],{type:"text/html"});
const a=document.createElement("a");
a.href=URL.createObjectURL(blob);
a.download="pp-js-editor.html";
a.click();
};

</script>

</body>
</html>
