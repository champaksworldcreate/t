<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>M × N Boolean Grid Highlighter</title>

<style>
body{
    font-family: Arial, Helvetica, sans-serif;
    background: #eef8f8;
    text-align: center;
    margin: 20px;
}

h1{
    color: #00695c;
}

.controls{
    margin: 15px 0;
}

input{
    padding: 8px;
    font-size: 16px;
    border: 1px solid #00897b;
    border-radius: 6px;
}

#rows, #cols{
    width: 80px;
    text-align: center;
}

#expression{
    width: 480px;
    max-width: 95%;
}

button{
    padding: 8px 18px;
    font-size: 16px;
    background: #00897b;
    color: white;
    border: none;
    border-radius: 6px;
    cursor: pointer;
}

.grid-wrapper{
    width: 95vw;
    max-height: 70vh;
    overflow: auto;
    margin: auto;
    border: 2px solid #00897b;
    border-radius: 10px;
    padding: 10px;
    background: white;
}

#grid{
    display: grid;
    gap: 5px;
    justify-content: start;
}

.cell{
    width: 90px;
    height: 70px;
    border: 2px solid #00897b;
    border-radius: 8px;
    display: flex;
    justify-content: center;
    align-items: center;
    font-weight: bold;
    background: white;
    color: #00695c;
}

.highlight{
    background: gold;
    border-color: red;
    color: black;
}

#error{
    color: red;
    font-weight: bold;
    min-height: 24px;
    margin: 10px;
}
</style>
</head>

<body>

<h1>M × N Boolean Grid Highlighter</h1>

<div class="controls">
    Rows:
    <input type="number" id="rows" value="7" min="1">

    Columns:
    <input type="number" id="cols" value="7" min="1">

    <button onclick="makeGrid()">Generate Grid</button>
</div>

<div class="controls">
    Expression:
    <input
        type="text"
        id="expression"
        value="row = 1 and col = n"
        oninput="highlightGrid()"
        placeholder="Example: row = 1 and col = n">
</div>

<div id="error"></div>

<div class="grid-wrapper">
    <div id="grid"></div>
</div>

<script>
let m = 7; // total rows
let n = 7; // total columns

function makeGrid(){
    m = Number(document.getElementById("rows").value);
    n = Number(document.getElementById("cols").value);

    const grid = document.getElementById("grid");
    grid.innerHTML = "";
    grid.style.gridTemplateColumns = `repeat(${n}, 90px)`;

    for(let row = 1; row <= m; row++){
        for(let col = 1; col <= n; col++){
            const cell = document.createElement("div");

            cell.className = "cell";
            cell.dataset.row = row;
            cell.dataset.col = col;
            cell.textContent = `(${row}, ${col})`;

            grid.appendChild(cell);
        }
    }

    highlightGrid();
}

function tokenize(text){
    return text
        .toLowerCase()
        .replace(/<=|>=|!=|=|<|>|\(|\)|\+|-|\*|\/|%|\band\b|\bor\b|\bnot\b/g, " $& ")
        .trim()
        .split(/\s+/)
        .filter(token => token.length > 0);
}

function getValue(token, row, col){
    if(token === "row") return row;
    if(token === "col") return col;
    if(token === "m") return m;
    if(token === "n") return n;

    if(!isNaN(Number(token))){
        return Number(token);
    }

    throw "Unknown word: " + token;
}

function evaluate(expression, row, col){
    const tokens = tokenize(expression);
    let index = 0;

    function peek(){
        return tokens[index];
    }

    function next(){
        return tokens[index++];
    }

    function numberExpression(){
        let value = term();

        while(peek() === "+" || peek() === "-"){
            const operator = next();
            const right = term();

            if(operator === "+") value = value + right;
            if(operator === "-") value = value - right;
        }

        return value;
    }

    function term(){
        let value = factor();

        while(peek() === "*" || peek() === "/" || peek() === "%"){
            const operator = next();
            const right = factor();

            if(operator === "*") value = value * right;
            if(operator === "/") value = value / right;
            if(operator === "%") value = value % right;
        }

        return value;
    }

    function factor(){
        if(peek() === "("){
            next();

            const value = numberExpression();

            if(next() !== ")"){
                throw "Missing closing bracket";
            }

            return value;
        }

        return getValue(next(), row, col);
    }

    function comparison(){
        const left = numberExpression();
        const operator = next();
        const right = numberExpression();

        if(operator === "=") return left === right;
        if(operator === "!=") return left !== right;
        if(operator === "<") return left < right;
        if(operator === ">") return left > right;
        if(operator === "<=") return left <= right;
        if(operator === ">=") return left >= right;

        throw "Use a comparison like row = 1";
    }

    function boolFactor(){
        if(peek() === "not"){
            next();
            return !boolFactor();
        }

        if(peek() === "("){
            next();

            const result = boolExpression();

            if(next() !== ")"){
                throw "Missing closing bracket";
            }

            return result;
        }

        return comparison();
    }

    function boolTerm(){
        let result = boolFactor();

        while(peek() === "and"){
            next();
            result = result && boolFactor();
        }

        return result;
    }

    function boolExpression(){
        let result = boolTerm();

        while(peek() === "or"){
            next();
            result = result || boolTerm();
        }

        return result;
    }

    const answer = boolExpression();

    if(index < tokens.length){
        throw "Extra text found: " + tokens[index];
    }

    return answer;
}

function highlightGrid(){
    const expression = document.getElementById("expression").value;
    const cells = document.querySelectorAll(".cell");
    const errorBox = document.getElementById("error");

    errorBox.textContent = "";

    for(const cell of cells){
        const row = Number(cell.dataset.row);
        const col = Number(cell.dataset.col);

        try{
            if(evaluate(expression, row, col)){
                cell.classList.add("highlight");
            }else{
                cell.classList.remove("highlight");
            }
        }
        catch(error){
            cell.classList.remove("highlight");
            errorBox.textContent = error;
        }
    }
}

makeGrid();
</script>

</body>
</html>
