<!doctype html>

<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Programmer’s Picnic — 3D Eclipse Visualizer</title>
<meta name="theme-color" content="#d97706" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700;900&display=swap" rel="stylesheet" /><style>
:root{
  --bg:#fff7e6;
  --panel:rgba(255,255,255,.9);
  --ink:#1f2328;
  --muted:#5b6570;
  --line:rgba(31,35,40,.12);
  --saffron:#ff9f1c;
  --saffron2:#ffb74d;
  --r:18px;
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:"DM Sans",system-ui;
  background:radial-gradient(900px 600px at 10% 10%,rgba(255,159,28,.35),transparent 55%),var(--bg);
  color:var(--ink);
}
.wrap{max-width:1200px;margin:auto;padding:16px}
.card{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:var(--r);
  box-shadow:0 18px 50px rgba(31,35,40,.12);
  overflow:hidden;
}
.header{
  padding:12px 16px;
  border-bottom:1px solid var(--line);
  display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap
}
.stage{
  position:relative;
  aspect-ratio:16/9;
  min-height:360px;
}
canvas{width:100%;height:100%;display:block}
.controls{padding:16px;display:grid;gap:12px}
.field{font-size:13px}
input[type=range]{width:100%}
button{
  padding:8px 14px;
  border-radius:999px;
  border:1px solid var(--line);
  background:white;
  font-weight:700;
  cursor:pointer;
}
button.primary{
  background:linear-gradient(135deg,var(--saffron),var(--saffron2));
}
.tabs{display:flex;gap:8px;margin-top:12px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:8px;border-bottom:1px solid var(--line);text-align:left}
th{font-size:12px;color:var(--muted)}
</style></head>
<body>
<div class="wrap">
<div class="card">
<div class="header">
<div><strong>3D Eclipse Visualizer</strong><div style="font-size:12px;color:var(--muted)">Solar + Lunar</div></div>
<div>
<button id="solarBtn" class="primary">Solar</button>
<button id="lunarBtn">Lunar</button>
</div>
</div>
<div class="stage">
<canvas id="gl"></canvas>
</div>
<div class="controls">
<div class="field">Offset <input id="offset" type="range" min="-10" max="10" step="0.1" value="0"></div>
<div class="field">Moon Distance <input id="distance" type="range" min="0.8" max="1.2" step="0.01" value="1"></div>
<div class="field">Speed <input id="speed" type="range" min="0" max="3" step="0.1" value="1"></div>
<div>
<button id="playBtn" class="primary">Pause</button>
<button id="resetBtn">Reset</button>
</div>
<div><strong id="result">—</strong></div><div class="tabs">
<button id="solarTab" class="primary">Solar List</button>
<button id="lunarTab">Lunar List</button>
</div><table>
<thead>
<tr><th>Date</th><th>Type</th><th>Notes</th></tr>
</thead>
<tbody id="listBody"></tbody>
</table>
</div>
</div>
</div><script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script><script>
(function(){
if(!window.THREE){ alert("Three.js failed to load."); return; }

const canvas=document.getElementById("gl");
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true});
renderer.setPixelRatio(Math.min(2,window.devicePixelRatio||1));

const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(50,16/9,0.1,1000);
camera.position.set(0,10,40);

scene.add(new THREE.AmbientLight(0xffffff,0.6));
const sunLight=new THREE.PointLight(0xffffff,2);
scene.add(sunLight);

const SUN_R=4,EARTH_R=2,MOON_R=0.6;
const sun=new THREE.Mesh(new THREE.SphereGeometry(SUN_R,48,48),new THREE.MeshStandardMaterial({color:0xffbe3c,emissive:0xffbe3c,emissiveIntensity:0.8}));
const earth=new THREE.Mesh(new THREE.SphereGeometry(EARTH_R,48,48),new THREE.MeshStandardMaterial({color:0x82aaff}));
const moon=new THREE.Mesh(new THREE.SphereGeometry(MOON_R,32,32),new THREE.MeshStandardMaterial({color:0xe6e6eb}));
scene.add(sun,earth,moon);

let mode="solar";
let playing=true;
let t=0;

function resize(){
const rect=canvas.getBoundingClientRect();
renderer.setSize(rect.width,rect.height,false);
camera.aspect=rect.width/rect.height;
camera.updateProjectionMatrix();
}
window.addEventListener("resize",resize);
resize();

function updateWorld(){
sun.position.set(-20,0,0);
earth.position.set(20,0,0);
sunLight.position.copy(sun.position);

const offset=parseFloat(document.getElementById("offset").value);
const dist=parseFloat(document.getElementById("distance").value);

const orbit=6*dist;
const ang=t*0.6;

let x=Math.cos(ang)*orbit;
let y=Math.sin(offset*Math.PI/180)*orbit;
let z=Math.sin(ang)*orbit;

if(mode==="solar") x=-Math.abs(x);
else x=Math.abs(x);

moon.scale.setScalar(1/dist);
moon.position.copy(earth.position).add(new THREE.Vector3(x,y,z));

let label="No eclipse";
if(Math.abs(moon.position.y-earth.position.y)<1.2){
label=mode==="solar"?"Solar alignment":"Lunar alignment";
}

document.getElementById("result").textContent=label;
}

function loop(){
if(playing) t+=0.01*parseFloat(document.getElementById("speed").value);
updateWorld();
renderer.render(scene,camera);
requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

// Buttons
const solarBtn=document.getElementById("solarBtn");
const lunarBtn=document.getElementById("lunarBtn");

solarBtn.onclick=function(){mode="solar";solarBtn.classList.add("primary");lunarBtn.classList.remove("primary");};
lunarBtn.onclick=function(){mode="lunar";lunarBtn.classList.add("primary");solarBtn.classList.remove("primary");};

document.getElementById("playBtn").onclick=function(){playing=!playing;this.textContent=playing?"Pause":"Play";};
document.getElementById("resetBtn").onclick=function(){t=0;};

// Lists
const solarList=[
["2024-04-08","Total","North America"],
["2024-10-02","Annular","Pacific"],
["2025-03-29","Partial","Europe"],
["2025-09-21","Partial","Pacific"],
["2026-02-17","Annular","South America"],
["2026-08-12","Total","North America"],
["2027-02-06","Annular","Africa"],
["2027-08-02","Total","Europe"],
["2028-01-26","Annular","Americas"],
["2028-07-22","Total","Australia"]
];

const lunarList=[
["2023-10-28","Partial","Europe"],
["2024-03-25","Penumbral","Americas"],
["2024-09-18","Partial","Americas"],
["2025-03-14","Total","Americas"],
["2025-09-07","Total","Europe"],
["2026-08-28","Partial","Americas"],
["2027-02-20","Penumbral","Asia"],
["2027-07-18","Penumbral","Africa"],
["2027-08-17","Penumbral","Pacific"],
["2028-01-12","Partial","Americas"]
];

function renderList(arr){
const body=document.getElementById("listBody");
body.innerHTML="";
arr.forEach(e=>{
const tr=document.createElement("tr");
tr.innerHTML=`<td>${e[0]}</td><td>${e[1]}</td><td>${e[2]}</td>`;
body.appendChild(tr);
});
}
renderList(solarList);

const solarTab=document.getElementById("solarTab");
const lunarTab=document.getElementById("lunarTab");

solarTab.onclick=function(){renderList(solarList);solarTab.classList.add("primary");lunarTab.classList.remove("primary");};
lunarTab.onclick=function(){renderList(lunarList);lunarTab.classList.add("primary");solarTab.classList.remove("primary");};

})();
</script></body>
</html>
