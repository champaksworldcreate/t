<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Website Builder V7</title>

<style>
body{margin:0;font-family:Arial;background:#fffaf0;color:#2b2112}
.box{max-width:1150px;margin:24px auto;padding:20px;background:#fff;border:1px solid #f0dcc2;border-radius:16px}

button{padding:10px 14px;border:0;border-radius:10px;background:#d97706;color:white;font-weight:bold;cursor:pointer;margin:4px}
button.secondary{background:#fff6e6;color:#2b2112;border:1px solid #f0dcc2}
button.active{background:#f59e0b}

input,textarea{width:100%;max-width:500px;padding:10px;border:1px solid #f0dcc2;border-radius:10px}
textarea{min-height:90px}

.options{display:flex;flex-wrap:wrap;gap:8px}

.progress{height:10px;background:#f7e6c8;border-radius:999px;overflow:hidden;margin:12px 0}
.progress span{display:block;height:100%;background:linear-gradient(90deg,#d97706,#f59e0b)}

iframe{width:100%;height:460px;border:1px solid #f0dcc2;border-radius:14px;margin-top:16px;background:white}

.card{border:1px solid #f0dcc2;padding:10px;border-radius:10px;margin:10px 0;background:#fff8ef}
</style>
</head>

<body>

<div class="box">
<h1>Website Builder V7</h1>

<h2 id="stepTitle"></h2>
<div class="progress"><span id="progressBar"></span></div>
<p id="question"></p>

<div id="stepArea"></div>

<br>
<button class="secondary" onclick="back()">Back</button>
<button onclick="next()">Next</button>
<button class="secondary" onclick="generateAI()">⚡ Auto Fill (AI)</button>

<hr>

<button onclick="downloadHTML()">Download HTML</button>
<button onclick="downloadJSON()">Download JSON</button>

<iframe id="preview"></iframe>
</div>

<script>

const steps=[
{key:"brand",q:"Brand name?",type:"text"},
{key:"tagline",q:"Tagline?",type:"text"},
{key:"type",q:"Website type?",type:"options",opt:["Business","Healthcare","Education","Portfolio"]},
{key:"sections",q:"Sections?",type:"multi",opt:["Hero","About","Services","Contact"]},

{key:"heroText",q:"Hero text",type:"textarea"},
{key:"aboutText",q:"About text",type:"textarea"},
{key:"servicesText",q:"Services text",type:"textarea"},
{key:"contactText",q:"Contact text",type:"textarea"}
];

let state={
step:0,
data:{
brand:"My Site",
tagline:"Your tagline here",
type:"Business",
sections:["Hero","About","Services","Contact"],
heroText:"",
aboutText:"",
servicesText:"",
contactText:""
}
};

function render(){
let s=steps[state.step];

stepTitle.innerText="Step "+(state.step+1)+" of "+steps.length;
question.innerText=s.q;
progressBar.style.width=((state.step+1)/steps.length*100)+"%";

let html="";

if(s.type==="text"){
html=`<input id="inp" value="${safe(state.data[s.key])}">`;
}

if(s.type==="textarea"){
html=`<textarea id="inp">${safe(state.data[s.key])}</textarea>`;
}

if(s.type==="options"){
html='<div class="options">';
s.opt.forEach(o=>{
let a=state.data[s.key]===o?"active":"";
html+=`<button class="${a}" onclick="setVal('${o}')">${o}</button>`;
});
html+='</div>';
}

if(s.type==="multi"){
html='<div class="options">';
s.opt.forEach(o=>{
let a=state.data.sections.includes(o)?"active":"";
html+=`<button class="${a}" onclick="toggle('${o}')">${o}</button>`;
});
html+='</div>';
}

stepArea.innerHTML=html;
update();
}

function saveInput(){
let s=steps[state.step];
if(s.type==="text"||s.type==="textarea"){
let el=document.getElementById("inp");
if(el) state.data[s.key]=el.value;
}
}

function next(){saveInput(); if(state.step<steps.length-1){state.step++;render();}}
function back(){saveInput(); if(state.step>0){state.step--;render();}}

function setVal(v){state.data[steps[state.step].key]=v;render();}

function toggle(v){
let arr=state.data.sections;
let i=arr.indexOf(v);
if(i>=0)arr.splice(i,1);else arr.push(v);
render();
}

function safe(s){
return String(s||"")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;");
}

/* 🤖 AI GENERATOR */
function generateAI(){
let d=state.data;

d.tagline=`Welcome to ${d.brand} — your trusted ${d.type} solution.`;

d.heroText=`At ${d.brand}, we provide high-quality ${d.type.toLowerCase()} services designed to help you grow and succeed.`;

d.aboutText=`${d.brand} is a dedicated ${d.type.toLowerCase()} platform focused on delivering value, trust, and excellence to every customer.`;

d.servicesText=`We offer a range of ${d.type.toLowerCase()} services including consultation, execution, and ongoing support.`;

d.contactText=`Contact ${d.brand} today to get started. We are here to help you succeed.`;

render();
}

/* BUILD WEBSITE */
function build(){
let d=state.data;

let html='<!doctype html><html><head><meta charset="utf-8">';
html+='<meta name="viewport" content="width=device-width">';
html+='<title>'+safe(d.brand)+'</title>';
html+='<style>body{margin:0;font-family:Arial;background:#fffaf0}section{padding:40px}header{background:#d97706;color:white;padding:15px}</style></head><body>';

html+='<header>'+safe(d.brand)+'</header>';

if(d.sections.includes("Hero")){
html+='<section><h1>'+safe(d.heroText||d.brand)+'</h1><p>'+safe(d.tagline)+'</p></section>';
}

if(d.sections.includes("About")){
html+='<section><h2>About</h2><p>'+safe(d.aboutText)+'</p></section>';
}

if(d.sections.includes("Services")){
html+='<section><h2>Services</h2><p>'+safe(d.servicesText)+'</p></section>';
}

if(d.sections.includes("Contact")){
html+='<section><h2>Contact</h2><p>'+safe(d.contactText)+'</p></section>';
}

html+='</body></html>';

return html;
}

function update(){
preview.srcdoc=build();
}

function downloadHTML(){
let blob=new Blob([build()],{type:"text/html"});
let a=document.createElement("a");
a.href=URL.createObjectURL(blob);
a.download="site.html";
a.click();
}

function downloadJSON(){
let blob=new Blob([JSON.stringify(state.data,null,2)],{type:"application/json"});
let a=document.createElement("a");
a.href=URL.createObjectURL(blob);
a.download="config.json";
a.click();
}

render();

</script>

</body>
</html>
